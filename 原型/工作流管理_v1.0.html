<!DOCTYPE html>

<title>原型 · 工作流管理 v1.0（中台后台样式）</title>
<style>
:root{--brand:#a86115;--amber:#f9ecc9;--ink:#303133;--text:#4a4f55;--muted:#606266;--weak:#909399;--line:#ebeef4;--head:#f2f5f9;--page:#f0f1f2;--danger:#f56c6c;--ok:#67c23a;--blue:#6f8db5}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input,select{font:inherit}.topbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 24px;position:relative;z-index:30}.logo{display:flex;align-items:center;gap:12px}.logo svg{width:34px;height:34px}.logo b{font-size:18px;font-weight:700;color:#3a3f45;letter-spacing:1px}.top-tabs{display:flex;align-items:center;gap:14px;margin-left:56px}.top-tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:4px;color:var(--text);cursor:pointer;user-select:none}.top-tab svg{width:16px;height:16px}.top-tab.active{background:var(--amber);color:#5c4a1e;font-weight:600}.tenant-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-weight:600;cursor:pointer}.caret{font-size:10px}.top-right{margin-left:auto;display:flex;align-items:center;gap:18px}.avatar{width:30px;height:30px;border-radius:50%;background:#e8eaed;display:inline-flex;align-items:center;justify-content:center;color:#aeb4bc}.quit{color:var(--blue);cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:224px;height:calc(100vh - 64px);background:#fff;border-right:1px solid var(--line);padding:10px 0;flex:0 0 auto;overflow-y:auto;position:sticky;top:0}.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#3f444a;cursor:pointer;user-select:none;background:transparent}.nav-item svg{width:17px;height:17px;flex:0 0 auto;color:#5b6167}.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item .chev{color:#b9bec4;font-size:11px;transition:transform .2s}.nav-item.group.open .chev{transform:rotate(180deg)}.nav-item:hover{background:#f7f8f9}.nav-item.child{padding-left:42px;height:40px;font-size:13px}.nav-item.child .dot-ic{width:15px;text-align:center;color:#9aa0a6}.nav-item.child.active{background:var(--amber);color:#6b4410;font-weight:600}.nav-item.child.active .dot-ic{color:var(--brand)}.nav-children{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}.nav-children>.nav-inner{overflow:hidden}.nav-children.open{grid-template-rows:1fr}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.crumb-bar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}.collapse-ic{display:inline-flex;color:#3f444a;cursor:pointer}.crumb{color:#3f444a}.crumb b{color:#6b4410;font-weight:600}.tab-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}.tab-nav{color:#b9bec4;font-size:16px;cursor:pointer}.tab{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;background:var(--amber);color:#6b4410;font-size:13px;font-weight:600}.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}.tab .x{cursor:pointer;opacity:.7}.page-body{padding:18px 20px;flex:1;min-width:0}.card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(31,41,55,.04);margin-bottom:14px}.filter-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}.fitem{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.fitem input,.fitem select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:var(--ink);outline:none;background:#fff}.fitem input{width:190px}.fitem select{min-width:136px}.fitem input:focus,.fitem select:focus{border-color:var(--brand)}.factions{display:inline-flex;gap:10px}.toolbar{display:flex;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.toolbar-actions{margin-left:auto}.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:13px}.btn:hover{color:var(--brand);border-color:#e3c692}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#8f5212;color:#fff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(31,41,55,.04);overflow:auto}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1260px}th{height:46px;background:var(--head);color:#5b6167;font-weight:600;border-bottom:1px solid var(--line);text-align:left;padding:0 14px;white-space:nowrap}td{height:52px;border-bottom:1px solid var(--line);padding:0 14px;color:var(--muted);vertical-align:middle;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fdf9f0}.strong{color:var(--ink)}.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid}.tag.intent{background:#fff7e6;color:#a76705;border-color:#ffe1a6}.tag.api{background:#ecf5ff;color:#337ecc;border-color:#d9ecff}.tag.product{background:#f0f9eb;color:#4e8a35;border-color:#d3ecbc}.tag.faq{background:#f5f0ff;color:#6a4fb6;border-color:#e0d5ff}.link-btn{border:0;background:none;color:var(--brand);cursor:pointer;padding:3px 0}.link-btn:hover{text-decoration:underline}.empty-row td{text-align:center;height:110px;color:var(--weak)}.pager{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-top:1px solid var(--line);color:var(--muted)}.page-size{height:30px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;display:inline-flex;align-items:center;padding:0 12px;font-size:13px}.page-num{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);border:1px solid transparent;background:#fff}.page-num.active{background:var(--brand);color:#fff}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.45);display:none;align-items:center;justify-content:center;z-index:100}.modal.active{display:flex}.modal-box{width:480px;background:#fff;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.18);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}.modal-close{border:0;background:transparent;font-size:20px;color:var(--weak);cursor:pointer;line-height:1}.modal-body{padding:20px 22px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}.field{margin-bottom:17px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}.field label i{color:var(--danger);font-style:normal;margin-right:3px}.field input,.field select{width:100%;height:36px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;outline:none;color:var(--ink);background:#fff}.field input:focus,.field select:focus{border-color:var(--brand)}.field .err{display:none;color:var(--danger);font-size:12px;margin-top:4px}.field.invalid input,.field.invalid select{border-color:var(--danger)}.field.invalid .err{display:block}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:9px 18px;border-radius:4px;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.toast.ok{background:var(--ok)}.toast.info{background:#7a8699}
@media(max-width:1100px){.top-tabs{margin-left:22px;gap:6px}.top-right{gap:10px}.sidebar{width:210px}}
</style>
<style>
/* 列表筛选：参考后台「筛选」按钮浮层交互 */
.list-filter-card{position:relative;padding:0!important;overflow:visible;min-height:62px}
.list-toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.list-toolbar-primary,.list-toolbar-actions{display:flex;align-items:center;gap:10px}.list-toolbar-actions{margin-left:auto}
.filter-trigger svg{width:15px;height:15px;flex:0 0 auto}
.export-trigger svg{width:15px;height:15px;flex:0 0 auto}
.filter-popover{position:absolute;z-index:45;right:20px;top:58px;width:min(920px,calc(100vw - 300px));min-width:420px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:24px 26px 20px;box-shadow:0 8px 24px rgba(31,35,41,.16)}
.filter-popover.compact{width:440px}.filter-popover.medium{width:min(720px,calc(100vw - 300px))}.filter-popover[hidden]{display:none}
.filter-popover:before{content:"";position:absolute;right:34px;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid #e4e7ed;border-top:1px solid #e4e7ed;transform:rotate(45deg)}
.filter-popover .filter-bar,.filter-popover .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;align-items:center}
.filter-popover .filter-bar .fitem,.filter-popover .form-grid label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;margin:0}
.filter-popover .filter-bar .fitem input,.filter-popover .filter-bar .fitem select,.filter-popover .form-grid input,.filter-popover .form-grid select{width:100%;max-width:none}
.filter-popover .filter-footer,.filter-popover .form-actions{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:18px;border-top:1px solid #f0f1f3}
.filter-popover .filter-footer .btn,.filter-popover .form-actions .btn{min-width:72px}
@media(max-width:900px){.filter-popover,.filter-popover.medium{right:10px;width:calc(100vw - 270px);min-width:360px}.filter-popover .filter-bar,.filter-popover .form-grid{grid-template-columns:1fr}}
</style>
<style>
.filter-popover.compact .filter-bar{grid-template-columns:1fr}
.filter-popover .form-grid label.duration-filter{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filter-popover .form-grid label.duration-filter>select{width:92px}.filter-popover .form-grid label.duration-filter>input{width:150px}.filter-popover .form-grid label.duration-filter .totalMaxWrap{display:inline-flex;align-items:center;gap:8px}.filter-popover .form-grid label.duration-filter .totalMaxWrap[hidden]{display:none}
</style>
</head>

<div class="modal" id="form-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box"><div class="modal-head"><span id="modal-title">新增工作流</span><button type="button" class="modal-close" id="modal-close" aria-label="关闭">×</button></div><div class="modal-body"><div class="field" id="f-agent-type"><label for="i-agent-type"><i>*</i>智能体类型</label><select id="i-agent-type"><option value="">请选择智能体类型</option><option value="飞书aily-工作流应用">飞书aily-工作流应用</option></select><div class="err">请选择智能体类型</div></div><div class="field" id="f-type"><label for="i-type"><i>*</i>工作流类型</label><select id="i-type"><option value="">请选择工作流类型</option><option value="意图识别">意图识别</option><option value="业务API">业务API</option><option value="商品知识库">商品知识库</option><option value="FAQ知识库">FAQ知识库</option></select><div class="err">请选择工作流类型</div></div><div class="field" id="f-name"><label for="i-name"><i>*</i>工作流名称</label><input id="i-name" maxlength="50" placeholder="请输入工作流名称"><div class="err">请输入工作流名称</div></div><div class="field" id="f-workflow-id"><label for="i-workflow-id"><i>*</i>工作流ID</label><input id="i-workflow-id" maxlength="80" placeholder="请输入工作流ID"><div class="err">请输入工作流ID</div></div></div><div class="modal-foot"><button type="button" class="btn" id="modal-cancel">取消</button><button type="button" class="btn primary" id="modal-save">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var PAGES={'艾客坐席管理':'艾客坐席管理_v1.0.html','供应商管理':'供应商管理_v1.0.html','AI托管账号':'AI托管账号_v1.0.html','客户会话管理':'客户会话管理_v1.0.html','会话消息管理':'会话消息管理_v1.0.html','AI回复响应管理':'AI回复响应管理_v1.0.html','智能体管理':'智能体管理_v1.0.html'};
function pageUrl(file){var u=new URL(file,location.href);var p=new URLSearchParams(location.search);['embed','sandbox'].forEach(function(k){if(p.has(k))u.searchParams.set(k,p.get(k));});return u.href;}
document.querySelectorAll('.js-nav').forEach(function(el){el.tabIndex=0;el.setAttribute('role','link');function go(){var file=PAGES[el.dataset.page];if(file)location.href=pageUrl(file);}el.addEventListener('click',go);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
document.querySelectorAll('.group').forEach(function(el){function toggle(){var group=el.dataset.group;el.classList.toggle('open');var child=document.querySelector('[data-children="'+group+'"]');if(child)child.classList.toggle('open',el.classList.contains('open'));}el.addEventListener('click',toggle);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});});
function showToast(message,kind){var toast=document.getElementById('toast');toast.className='toast '+(kind||'ok');toast.textContent=message;toast.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){toast.style.display='none';},2200);}
document.querySelectorAll('.js-nothing').forEach(function(el){el.addEventListener('click',function(){showToast('该入口不在本次原型范围内','info');});});
var rows=[
{id:1,agentType:'飞书aily-工作流应用',type:'意图识别',name:'会员服务意图识别',workflowId:'wf_intent_member_service',creator:'陈嘉豪',ctime:'2026-09-08 10:20',updater:'陈嘉豪',utime:'2026-09-09 14:35'},
{id:2,agentType:'飞书aily-工作流应用',type:'业务API',name:'会员积分查询接口',workflowId:'wf_api_member_points',creator:'李佳',ctime:'2026-09-08 11:05',updater:'李佳',utime:'2026-09-09 16:18'},
{id:3,agentType:'飞书aily-工作流应用',type:'FAQ知识库',name:'到店预约FAQ',workflowId:'wf_faq_store_booking',creator:'王明',ctime:'2026-09-09 09:12',updater:'陈嘉豪',utime:'2026-09-09 17:30'}
];
var nextId=4, editingId=null, filtered=rows.slice();
var tbody=document.getElementById('tbody'), pagerInfo=document.getElementById('pager-info');
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ordered(list){return list.slice().sort(function(a,b){return String(b.ctime).localeCompare(String(a.ctime))||b.id-a.id;});}
function render(){filtered=ordered(filtered);var html=filtered.map(function(row){var cls={'意图识别':'intent','业务API':'api','商品知识库':'product','FAQ知识库':'faq'}[row.type]||'intent';return '<tr><td class="strong">'+row.id+'</td><td>'+esc(row.agentType)+'</td><td><span class="tag '+cls+'">'+esc(row.type)+'</span></td><td class="strong">'+esc(row.name)+'</td><td>'+esc(row.workflowId)+'</td><td>'+esc(row.creator)+'</td><td>'+esc(row.ctime)+'</td><td>'+esc(row.updater)+'</td><td>'+esc(row.utime)+'</td><td><button class="link-btn" data-edit="'+row.id+'">编辑</button></td></tr>';}).join('');tbody.innerHTML=html||'<tr class="empty-row"><td colspan="10">暂无符合条件的工作流</td></tr>';pagerInfo.textContent='共 '+filtered.length+' 条';tbody.querySelectorAll('[data-edit]').forEach(function(btn){btn.addEventListener('click',function(){openEdit(Number(btn.dataset.edit));});});}
function query(){var agentType=document.getElementById('q-agent-type').value,type=document.getElementById('q-type').value,name=document.getElementById('q-name').value.trim().toLowerCase();filtered=rows.filter(function(row){return (!agentType||row.agentType===agentType)&&(!type||row.type===type)&&(!name||row.name.toLowerCase().includes(name));});render();}
var filterTrigger=document.getElementById('btn-filter'),filterPopover=document.getElementById('filter-popover');
function setFilterOpen(open){filterPopover.hidden=!open;filterTrigger.setAttribute('aria-expanded',String(open));if(open)setTimeout(function(){document.getElementById('q-agent-type').focus();},0);}
filterTrigger.addEventListener('click',function(e){e.stopPropagation();setFilterOpen(filterPopover.hidden);});
document.getElementById('btn-filter-close').addEventListener('click',function(){setFilterOpen(false);});
document.getElementById('btn-query').addEventListener('click',function(){query();setFilterOpen(false);});document.getElementById('q-name').addEventListener('keydown',function(e){if(e.key==='Enter'){query();setFilterOpen(false);}});document.getElementById('btn-reset').addEventListener('click',function(){document.getElementById('q-agent-type').value='';document.getElementById('q-type').value='';document.getElementById('q-name').value='';filtered=ordered(rows);render();});
filterPopover.addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){setFilterOpen(false);});document.addEventListener('keydown',function(e){if(e.key==='Escape')setFilterOpen(false);});
var modal=document.getElementById('form-modal'), inputs={agentType:document.getElementById('i-agent-type'),type:document.getElementById('i-type'),name:document.getElementById('i-name'),workflowId:document.getElementById('i-workflow-id')};
function clearErrors(){['f-agent-type','f-type','f-name','f-workflow-id'].forEach(function(id){document.getElementById(id).classList.remove('invalid');});}
function openAdd(){editingId=null;document.getElementById('modal-title').textContent='新增工作流';inputs.agentType.value='';inputs.type.value='';inputs.name.value='';inputs.workflowId.value='';clearErrors();modal.classList.add('active');inputs.agentType.focus();}
function openEdit(id){var row=rows.find(function(item){return item.id===id;});if(!row)return;editingId=id;document.getElementById('modal-title').textContent='编辑工作流';inputs.agentType.value=row.agentType;inputs.type.value=row.type;inputs.name.value=row.name;inputs.workflowId.value=row.workflowId;clearErrors();modal.classList.add('active');inputs.agentType.focus();}
function closeModal(){modal.classList.remove('active');clearErrors();}
document.getElementById('btn-add').addEventListener('click',openAdd);document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal-cancel').addEventListener('click',closeModal);
Object.keys(inputs).forEach(function(key){inputs[key].addEventListener('input',function(){var fieldId=key==='workflowId'?'f-workflow-id':key==='agentType'?'f-agent-type':'f-'+key;if(inputs[key].value.trim())document.getElementById(fieldId).classList.remove('invalid');});});
function timestamp(){var d=new Date(),pad=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
document.getElementById('modal-save').addEventListener('click',function(){clearErrors();var agentType=inputs.agentType.value,type=inputs.type.value,name=inputs.name.value.trim(),workflowId=inputs.workflowId.value.trim(),valid=true;if(!agentType){document.getElementById('f-agent-type').classList.add('invalid');valid=false;}if(!type){document.getElementById('f-type').classList.add('invalid');valid=false;}if(!name){document.getElementById('f-name').classList.add('invalid');valid=false;}if(!workflowId){document.getElementById('f-workflow-id').classList.add('invalid');valid=false;}if(!valid)return;var now=timestamp();if(editingId===null){rows.unshift({id:nextId++,agentType:agentType,type:type,name:name,workflowId:workflowId,creator:'陈嘉豪',ctime:now,updater:'陈嘉豪',utime:now});}else{var row=rows.find(function(item){return item.id===editingId;});if(row){row.agentType=agentType;row.type=type;row.name=name;row.workflowId=workflowId;row.updater='陈嘉豪';row.utime=now;}}closeModal();document.getElementById('q-agent-type').value='';document.getElementById('q-type').value='';document.getElementById('q-name').value='';filtered=ordered(rows);render();showToast(editingId===null?'新增成功':'保存成功','ok');});
render();
})();
</script>
</body>
</html>
