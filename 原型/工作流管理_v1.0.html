<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 工作流管理 v1.0（中台后台样式）</title>
<style>
:root{--brand:#a86115;--amber:#f9ecc9;--ink:#303133;--text:#4a4f55;--muted:#606266;--weak:#909399;--line:#ebeef4;--head:#f2f5f9;--page:#f0f1f2;--danger:#f56c6c;--ok:#67c23a;--blue:#6f8db5}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input,select{font:inherit}.topbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 24px;position:relative;z-index:30}.logo{display:flex;align-items:center;gap:12px}.logo img{height:34px;width:auto;display:block}.logo b{font-size:18px;font-weight:700;color:#3a3f45;letter-spacing:1px}.top-tabs{display:flex;align-items:center;gap:14px;margin-left:56px}.top-tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:4px;color:var(--text);cursor:pointer;user-select:none}.top-tab svg{width:16px;height:16px}.top-tab.active{background:var(--amber);color:#5c4a1e;font-weight:600}.tenant-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-weight:600;cursor:pointer}.caret{font-size:10px}.top-right{margin-left:auto;display:flex;align-items:center;gap:18px}.avatar{width:30px;height:30px;border-radius:50%;background:#e8eaed;display:inline-flex;align-items:center;justify-content:center;color:#aeb4bc}.quit{color:var(--blue);cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:224px;height:calc(100vh - 64px);background:#fff;border-right:1px solid var(--line);padding:10px 0;flex:0 0 auto;overflow-y:auto;position:sticky;top:0}.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#3f444a;cursor:pointer;user-select:none;background:transparent}.nav-item svg{width:17px;height:17px;flex:0 0 auto;color:#5b6167}.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item .chev{color:#b9bec4;font-size:11px;transition:transform .2s}.nav-item.group.open .chev{transform:rotate(180deg)}.nav-item:hover{background:#f7f8f9}.nav-item.child{padding-left:42px;height:40px;font-size:13px}.nav-item.child .dot-ic{width:15px;text-align:center;color:#9aa0a6}.nav-item.child.active{background:var(--amber);color:#6b4410;font-weight:600}.nav-item.child.active .dot-ic{color:var(--brand)}.nav-children{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}.nav-children>.nav-inner{overflow:hidden}.nav-children.open{grid-template-rows:1fr}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.crumb-bar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}.collapse-ic{display:inline-flex;color:#3f444a;cursor:pointer}.crumb{color:#3f444a}.crumb b{color:#6b4410;font-weight:600}.tab-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}.tab-nav{color:#b9bec4;font-size:16px;cursor:pointer}.tab{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;background:var(--amber);color:#6b4410;font-size:13px;font-weight:600}.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}.tab .x{cursor:pointer;opacity:.7}.page-body{padding:18px 20px;flex:1;min-width:0}.card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(31,41,55,.04);margin-bottom:14px}.filter-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}.fitem{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.fitem input,.fitem select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:var(--ink);outline:none;background:#fff}.fitem input{width:190px}.fitem select{min-width:136px}.fitem input:focus,.fitem select:focus{border-color:var(--brand)}.factions{display:inline-flex;gap:10px}.toolbar{display:flex;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.toolbar-actions{margin-left:auto}.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:13px}.btn:hover{color:var(--brand);border-color:#e3c692}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#8f5212;color:#fff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(31,41,55,.04);overflow:auto}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1260px}th{height:46px;background:var(--head);color:#5b6167;font-weight:600;border-bottom:1px solid var(--line);text-align:left;padding:0 14px;white-space:nowrap}td{height:52px;border-bottom:1px solid var(--line);padding:0 14px;color:var(--muted);vertical-align:middle;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fdf9f0}.strong{color:var(--ink)}.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid}.tag.intent{background:#fff7e6;color:#a76705;border-color:#ffe1a6}.tag.api{background:#ecf5ff;color:#337ecc;border-color:#d9ecff}.tag.product{background:#f0f9eb;color:#4e8a35;border-color:#d3ecbc}.tag.faq{background:#f5f0ff;color:#6a4fb6;border-color:#e0d5ff}.link-btn{border:0;background:none;color:var(--brand);cursor:pointer;padding:3px 0}.link-btn:hover{text-decoration:underline}.empty-row td{text-align:center;height:110px;color:var(--weak)}.pager{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-top:1px solid var(--line);color:var(--muted)}.page-size{height:30px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;display:inline-flex;align-items:center;padding:0 12px;font-size:13px}.page-num{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);border:1px solid transparent;background:#fff}.page-num.active{background:var(--brand);color:#fff}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.45);display:none;align-items:center;justify-content:center;z-index:100}.modal.active{display:flex}.modal-box{width:480px;background:#fff;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.18);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}.modal-close{border:0;background:transparent;font-size:20px;color:var(--weak);cursor:pointer;line-height:1}.modal-body{padding:20px 22px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}.field{margin-bottom:17px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}.field label i{color:var(--danger);font-style:normal;margin-right:3px}.field input,.field select{width:100%;height:36px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;outline:none;color:var(--ink);background:#fff}.field input:focus,.field select:focus{border-color:var(--brand)}.field .err{display:none;color:var(--danger);font-size:12px;margin-top:4px}.field.invalid input,.field.invalid select{border-color:var(--danger)}.field.invalid .err{display:block}.field select:disabled{background:#f5f7fa;color:#a8abb2;cursor:not-allowed}.field .tip2{color:var(--weak);font-size:12px;margin-top:4px}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:9px 18px;border-radius:4px;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.toast.ok{background:var(--ok)}.toast.info{background:#7a8699}
@media(max-width:1100px){.top-tabs{margin-left:22px;gap:6px}.top-right{gap:10px}.sidebar{width:210px}}
</style>
<style>
/* 列表筛选：参考后台「筛选」按钮浮层交互 */
.list-filter-card{position:relative;padding:0!important;overflow:visible;min-height:62px}
.list-toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.list-toolbar-primary,.list-toolbar-actions{display:flex;align-items:center;gap:10px}.list-toolbar-actions{margin-left:auto}
.filter-trigger svg{width:15px;height:15px;flex:0 0 auto}
.export-trigger svg{width:15px;height:15px;flex:0 0 auto}
.filter-popover{position:absolute;z-index:45;right:20px;top:58px;width:min(920px,calc(100vw - 300px));min-width:420px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:24px 26px 20px;box-shadow:0 8px 24px rgba(31,35,41,.16)}
.filter-popover.compact{width:440px}.filter-popover.medium{width:min(720px,calc(100vw - 300px))}.filter-popover[hidden]{display:none}
.filter-popover:before{content:"";position:absolute;right:34px;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid #e4e7ed;border-top:1px solid #e4e7ed;transform:rotate(45deg)}
.filter-popover .filter-bar,.filter-popover .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;align-items:center}
.filter-popover .filter-bar .fitem,.filter-popover .form-grid label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;margin:0}
.filter-popover .filter-bar .fitem input,.filter-popover .filter-bar .fitem select,.filter-popover .form-grid input,.filter-popover .form-grid select{width:100%;max-width:none}
.filter-popover .filter-footer,.filter-popover .form-actions{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:18px;border-top:1px solid #f0f1f3}
.filter-popover .filter-footer .btn,.filter-popover .form-actions .btn{min-width:72px}
@media(max-width:900px){.filter-popover,.filter-popover.medium{right:10px;width:calc(100vw - 270px);min-width:360px}.filter-popover .filter-bar,.filter-popover .form-grid{grid-template-columns:1fr}}
</style>
<style>
.filter-popover.compact .filter-bar{grid-template-columns:1fr}
.filter-popover .form-grid label.duration-filter{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filter-popover .form-grid label.duration-filter>select{width:92px}.filter-popover .form-grid label.duration-filter>input{width:150px}.filter-popover .form-grid label.duration-filter .totalMaxWrap{display:inline-flex;align-items:center;gap:8px}.filter-popover .form-grid label.duration-filter .totalMaxWrap[hidden]{display:none}
</style>
<style>
.op-btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 18px;border:0;border-radius:6px;background:#f4f5f7;color:var(--brand);font:inherit;font-size:13px;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap}
.op-btn:hover{background:#eceef2}
.op-btn.danger{color:#c0392b}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>

filterPopover.addEventListener('click',function(e){e.stopPropagation();});document.addEventListener('click',function(){setFilterOpen(false);});document.addEventListener('keydown',function(e){if(e.key==='Escape')setFilterOpen(false);});
var modal=document.getElementById('form-modal'), inputs={agent:document.getElementById('i-agent'),type:document.getElementById('i-type'),name:document.getElementById('i-name'),workflowId:document.getElementById('i-workflow-id')};
function clearErrors(){['f-agent','f-type','f-name','f-workflow-id'].forEach(function(id){document.getElementById(id).classList.remove('invalid');});}
function setTypeFieldsReadOnly(readOnly){inputs.agent.disabled=readOnly;inputs.type.disabled=readOnly;}
function openAdd(){editingId=null;document.getElementById('modal-title').textContent='新增工作流';setTypeFieldsReadOnly(false);inputs.agent.value='';inputs.type.value='';inputs.name.value='';inputs.workflowId.value='';clearErrors();modal.classList.add('active');inputs.agent.focus();}
function openEdit(id){var row=rows.find(function(item){return item.id===id;});if(!row)return;editingId=id;document.getElementById('modal-title').textContent='编辑工作流';setTypeFieldsReadOnly(true);inputs.agent.value=row.agent;inputs.type.value=row.type;inputs.name.value=row.name;inputs.workflowId.value=row.workflowId;clearErrors();modal.classList.add('active');inputs.name.focus();}
function closeModal(){modal.classList.remove('active');clearErrors();}
document.getElementById('btn-add').addEventListener('click',openAdd);document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal-cancel').addEventListener('click',closeModal);
Object.keys(inputs).forEach(function(key){inputs[key].addEventListener('input',function(){var fieldId=key==='workflowId'?'f-workflow-id':key==='agent'?'f-agent':'f-'+key;if(inputs[key].value.trim())document.getElementById(fieldId).classList.remove('invalid');});});
function timestamp(){var d=new Date(),pad=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
document.getElementById('modal-save').addEventListener('click',function(){clearErrors();var agent=inputs.agent.value,type=inputs.type.value,name=inputs.name.value.trim(),workflowId=inputs.workflowId.value.trim(),valid=true;if(!agent){document.getElementById('f-agent').classList.add('invalid');valid=false;}if(!type){document.getElementById('f-type').classList.add('invalid');valid=false;}if(!name){document.getElementById('f-name').classList.add('invalid');valid=false;}if(!workflowId){document.getElementById('f-workflow-id').classList.add('invalid');valid=false;}if(!valid)return;var now=timestamp();if(editingId===null){rows.unshift({id:nextId++,agent:agent,type:type,name:name,workflowId:workflowId,creator:'陈嘉豪',ctime:now,updater:'陈嘉豪',utime:now});}else{var row=rows.find(function(item){return item.id===editingId;});if(row){row.agent=agent;row.type=type;row.name=name;row.workflowId=workflowId;row.updater='陈嘉豪';row.utime=now;}}closeModal();document.getElementById('q-agent').value='';document.getElementById('q-type').value='';document.getElementById('q-name').value='';filtered=ordered(rows);render();showToast(editingId===null?'新增成功':'保存成功','ok');});
render();
})();
</script>
</body>
</html>
