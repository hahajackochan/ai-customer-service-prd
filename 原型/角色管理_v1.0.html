<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 角色管理 v1.0（租户管理-角色管理 · 数据权限）</title>
<style>
:root{--gold:#b8860b;--gold-deep:#a1760a;--amber:#f9ecc9;--ink:#303133;--text:#4a4f55;--muted:#606266;--weak:#909399;--line:#ebeef4;--page:#f0f1f2;--ok:#67c23a;--blue:#6f8db5;--danger:#f56c6c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}
.topbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 24px;position:relative;z-index:30;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;white-space:nowrap}.logo svg{width:32px;height:32px}.logo b{font-size:18px;font-weight:700;color:#3a3f45;letter-spacing:1px}
.top-tabs{display:flex;align-items:center;gap:14px;margin-left:56px}.top-tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:4px;color:var(--text);cursor:pointer;user-select:none}.top-tab svg{width:16px;height:16px}.top-tab.active{background:var(--amber);color:#6b4410;font-weight:600}
.tenant-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-weight:600;cursor:pointer;user-select:none}.tenant-pill .caret{font-size:10px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--ink);white-space:nowrap}.avatar{width:30px;height:30px;border-radius:50%;background:#e8eaed;display:inline-flex;align-items:center;justify-content:center;color:#aeb4bc}.quit{color:var(--gold);cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 65px)}.sidebar{width:224px;height:calc(100vh - 65px);position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex:0 0 auto;overflow-y:auto}
.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#3f444a;cursor:pointer;user-select:none;background:transparent}.nav-item svg{width:17px;height:17px;flex:0 0 auto;color:#5b6167}.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item:hover{background:#faf6ec}
.nav-item .chev{font-size:11px;color:#a8adb3;transition:transform .2s ease}
.nav-item.child{padding-left:42px;font-size:13.5px}.nav-item.child.active{background:var(--amber);color:#6b4410;font-weight:600}
.nav-children{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}.nav-children.open{grid-template-rows:1fr}.nav-children-inner{min-height:0;overflow:hidden}
.nav-group.open>.chev{transform:rotate(180deg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb-bar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.collapse-ic{display:inline-flex;color:#3f444a}.crumb{color:#3f444a}.crumb .sep{color:#b9bec4;margin:0 8px}.crumb .cur{color:#8a8f94}
.tab-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}
.tab-nav{color:#b9bec4;font-size:16px;cursor:pointer}.tab{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-size:13px;cursor:pointer;user-select:none}.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}.tab .x{color:#a3801f;font-size:14px;line-height:1}.tab.plain{background:transparent;color:var(--text)}
.page-body{padding:18px 20px;flex:1;min-width:0}
.table-card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(31,41,55,.04)}
.list-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 18px}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px}
.btn:hover{color:var(--gold);border-color:#e3c692}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.primary:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.btn svg{width:15px;height:15px}
.table-scroll{overflow:auto}
table{width:100%;min-width:1360px;border-collapse:collapse;font-size:13.5px}
thead th{background:#f5f7fa;color:#4a4f55;font-weight:700;text-align:center;padding:12px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody td{padding:13px 10px;text-align:center;border-bottom:1px solid #f2f4f7;color:var(--ink);white-space:nowrap}
tbody tr:hover td{background:#fafbfc}
tbody td.weak{color:var(--weak)}
.op-btn{height:28px;padding:0 10px;border-radius:4px;border:0;background:#f4f5f7;color:var(--gold);cursor:pointer;font-size:13px;margin:0 4px}
.op-btn:hover{background:#f0ead8}
.op-btn.danger{color:var(--danger)}
.op-btn.danger:hover{background:#fdeeee}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px 18px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.page-size{height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;color:var(--muted);background:#fff;outline:none}
.page-num{width:30px;height:30px;border-radius:4px;border:0;background:#f4f5f7;color:var(--muted);cursor:pointer}
.page-num.active{background:var(--gold);color:#fff}
.page-num:disabled{color:#c8ccd2;cursor:default}
.pager input.jump{width:48px;height:30px;border:1px solid #dcdfe6;border-radius:4px;text-align:center;color:var(--muted);outline:none}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.modal-box{width:760px;max-width:calc(100vw - 40px);background:#fff;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 60px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal-close{border:0;background:transparent;font-size:18px;color:#909399;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:16px 18px;overflow:auto}
.perm-types{display:flex;align-items:flex-end;gap:10px;margin:-4px 0 10px;border-bottom:1px solid var(--line)}
.perm-types-label{font-size:12.5px;color:var(--weak);flex:0 0 auto;padding-bottom:9px}
.perm-tabs{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap}
.perm-tab{height:32px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;border-radius:4px 4px 0 0}
.perm-tab:hover{color:var(--gold);background:#faf6ec}
.perm-tab.on{color:var(--gold);font-weight:600;border-bottom-color:var(--gold);background:#fdf8f3}
.perm-tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.perm-sub{font-size:12.5px;color:var(--weak);margin-bottom:12px}
.perm-xfer{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.xfer-panel{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;min-width:0}
.xfer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 10px;background:#f7f8fa;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.xfer-search{height:32px;margin:8px 10px 0;padding:0 10px;border:1px solid #dcdfe6;border-radius:4px;outline:none;font-size:13px;color:var(--ink);font-family:inherit;box-sizing:border-box;width:auto}
.xfer-search:focus{border-color:var(--gold)}
.xfer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 10px;font-size:12.5px;color:var(--weak)}
.perm-link{border:0;background:transparent;color:var(--gold);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit}
.perm-link:hover{text-decoration:underline}
.perm-link:disabled{color:#c8ccd2;cursor:default;text-decoration:none}
.xfer-list{overflow:auto;border-top:1px solid var(--line);max-height:min(260px,calc(100vh - 408px));min-height:132px}
.xfer-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px dashed var(--line);cursor:pointer;min-width:0}
.xfer-item:last-child{border-bottom:0}
.xfer-item:hover{background:#fafbfc}
.xfer-item:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.xfer-item.on{background:#fdf8f3}
.xfer-name{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer-id{color:var(--weak);font-size:12.5px;margin-left:auto;font-family:SFMono-Regular,Consolas,monospace}
.xfer-flag{flex:0 0 auto;font-size:12px;color:var(--gold);border:1px solid #f0d5bd;border-radius:9px;padding:0 7px;height:19px;line-height:18px;background:#fdf1e8}
.xfer-flag.plus{color:#b9bec6;border-color:#e6e8ec;background:#fff}
.xfer-x{flex:0 0 auto;color:#b9bec6;font-size:14px;line-height:1;padding:0 2px}
.xfer-item:hover .xfer-x{color:var(--gold)}
.xfer-empty{padding:26px 10px;text-align:center;color:var(--weak);font-size:12.5px;line-height:1.8}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:9px 18px;border-radius:4px;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.toast.ok{background:var(--ok)}.toast.info{background:#7a8699}
.focus-target{outline:2px solid #e3a344;outline-offset:2px}
</style>
</head>

        <button type="button" class="btn js-nothing" id="btn-filter"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.2l-3.6 1.7v-6.9L4 5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>筛选</button>
        <button type="button" class="btn primary js-nothing" id="btn-create"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>新建角色</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th style="min-width:70px">ID</th><th style="min-width:200px">角色名称</th><th style="min-width:220px">角色编码</th><th style="min-width:100px">创建人</th><th style="min-width:170px">创建时间</th><th style="min-width:100px">更新人</th><th style="min-width:170px">更新时间</th><th style="min-width:320px">操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="pager-total">共 0 条</span>
        <select class="page-size" id="page-size" aria-label="每页条数"><option>10条/页</option><option>20条/页</option><option>50条/页</option></select>
        <button type="button" class="page-num" id="page-prev" aria-label="上一页">‹</button>
        <span id="page-nums"></span>
        <button type="button" class="page-num" id="page-next" aria-label="下一页">›</button>
        <span>前往</span><input class="jump" id="page-jump" value="1" aria-label="前往页码"><span>页</span>
      </div>
    </div>
  </div>
</main>
</div>

<div class="modal" id="perm-modal" role="dialog" aria-modal="true" aria-labelledby="perm-title">
  <div class="modal-box">
    <div class="modal-head"><span id="perm-title">设置数据权限</span><button type="button" class="modal-close" id="perm-close" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div class="perm-types"><span class="perm-types-label">数据类型</span><div class="perm-tabs" id="perm-tabs" role="tablist" aria-label="数据类型"></div></div>
      <div class="perm-sub" id="perm-sub"></div>
      <div class="perm-xfer">
        <section class="xfer-panel">
          <div class="xfer-head"><span id="perm-left-title">AI托管账号</span></div>
          <input type="search" class="xfer-search" id="perm-search" placeholder="搜索账号名称 / 账号ID" aria-label="搜索AI托管账号" autocomplete="off">
          <div class="xfer-bar"><span id="perm-match">共 0 个账号</span><button type="button" class="perm-link" id="perm-pick-all">全选</button></div>
          <div class="xfer-list" id="perm-list"></div>
        </section>
        <section class="xfer-panel">
          <div class="xfer-head"><span id="perm-picked-title">已选账号</span></div>
          <div class="xfer-bar"><span id="perm-tip">已选 0 / 0 个账号</span><button type="button" class="perm-link" id="perm-clear">清空已选</button></div>
          <div class="xfer-list" id="perm-picked"></div>
        </section>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" id="perm-cancel">取消</button><button type="button" class="btn primary" id="perm-save">保存</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function(){
'use strict';
var STORE_KEY='dsh_proto_role_agent_scope_v1';
var ACCOUNTS=(function(){var arr=[];for(var i=1;i<=36;i++){arr.push({id:'wx_10'+(i<10?'0'+i:i),name:'会员助理 小菲'+i});}return arr;})();
var DATA_TYPES=[
  {
    key:'agent',
    label:'AI托管账号',
    desc:'勾选该角色可查看的AI托管账号；中台的AI托管账号、客户会话管理、会话消息管理、AI响应明细等列表按此权限展示数据',
    leftTitle:'AI托管账号',
    pickedTitle:'已选账号',
    unit:'个账号',
    noun:'账号',
    searchPlaceholder:'搜索账号名称 / 账号ID',
    emptyText:'当前租户暂无AI托管账号',
    items:ACCOUNTS
  }
];
var ROLES=[
  {id:127,name:'建行支付分账服务能力',code:'ccb_payment',creator:'钟进星',createdAt:'2026-09-02 15:03:56',updater:'赵建辉',updatedAt:'2026-09-03 11:57:34'},
  {id:124,name:'异业合作管理员',code:'cooperation_admin',creator:'梁烨彤',createdAt:'2026-08-26 14:54:07',updater:'梁烨彤',updatedAt:'2026-09-17 16:28:29'},
  {id:116,name:'异业合作运营人员',code:'Promotion_Admin',creator:'梁烨彤',createdAt:'2026-05-20 18:36:36',updater:'梁烨彤',updatedAt:'2026-09-17 16:28:11'},
  {id:108,name:'整家事业部-策略分析室专员',code:'Strategic_Analysis_Specialist',creator:'陈嘉豪',createdAt:'2026-03-31 14:32:51',updater:'赵建辉',updatedAt:'2026-09-03 11:57:46'},
  {id:107,name:'广告分群管理员',code:'Ad_Group_Manager',creator:'陈嘉豪',createdAt:'2026-03-30 14:27:39',updater:'陈嘉豪',updatedAt:'2026-03-30 14:35:19'},
  {id:105,name:'直播管理员',code:'Live_Admin',creator:'梁烨彤',createdAt:'2026-03-11 15:43:30',updater:'赵建辉',updatedAt:'2026-09-03 11:57:50'},
  {id:102,name:'定制分销查看&导出',code:'Bringorders_Data',creator:'梁烨彤',createdAt:'2025-10-21 14:56:31',updater:'赵建辉',updatedAt:'2026-09-03 11:48:47'},
  {id:101,name:'定制分销管理员',code:'Bringorders_Operations',creator:'梁烨彤',createdAt:'2025-10-15 14:36:15',updater:'赵建辉',updatedAt:'2026-09-03 11:47:41'},
  {id:100,name:'小程序码管理员',code:'QR_Code_Admin',creator:'陈嘉豪',createdAt:'2025-09-26 17:28:41',updater:'赵建辉',updatedAt:'2026-09-03 11:57:54'},
  {id:99,name:'财务管理员',code:'Finance_Manager',creator:'陈嘉豪',createdAt:'2025-09-18 10:48:59',updater:'赵建辉',updatedAt:'2026-09-03 11:57:56'},
  {id:98,name:'会员管理员',code:'Member_Manager',creator:'梁烨彤',createdAt:'2025-08-21 10:12:33',updater:'赵建辉',updatedAt:'2026-08-12 15:21:09'},
  {id:97,name:'订单管理员',code:'Order_Admin',creator:'梁烨彤',createdAt:'2025-07-14 16:05:12',updater:'梁烨彤',updatedAt:'2026-07-30 09:42:18'},
  {id:96,name:'商品管理员',code:'Product_Admin',creator:'陈嘉豪',createdAt:'2025-06-09 11:38:27',updater:'赵建辉',updatedAt:'2026-06-18 14:07:52'},
  {id:95,name:'优惠券管理员',code:'Coupon_Admin',creator:'陈嘉豪',createdAt:'2025-05-27 09:54:41',updater:'赵建辉',updatedAt:'2026-05-11 16:33:07'},
  {id:94,name:'客服主管',code:'Service_Supervisor',creator:'钟进星',createdAt:'2025-04-16 14:20:58',updater:'梁烨彤',updatedAt:'2026-04-22 10:15:36'},
  {id:93,name:'数据分析师',code:'Data_Analyst',creator:'钟进星',createdAt:'2025-03-05 17:46:20',updater:'赵建辉',updatedAt:'2026-03-19 11:28:44'},
  {id:92,name:'门店店长',code:'Store_Manager',creator:'梁烨彤',createdAt:'2025-02-11 10:07:35',updater:'梁烨彤',updatedAt:'2026-02-24 15:52:11'},
  {id:91,name:'导购员',code:'Shopping_Guide',creator:'梁烨彤',createdAt:'2025-01-08 09:31:16',updater:'赵建辉',updatedAt:'2026-01-15 17:09:03'}
];
var PAGE_SIZE=10,page=1;
var tbody=document.getElementById('tbody');
var modal=document.getElementById('perm-modal');
var permList=document.getElementById('perm-list'),permTip=document.getElementById('perm-tip'),permTitle=document.getElementById('perm-title');
var permSearch=document.getElementById('perm-search'),permPicked=document.getElementById('perm-picked'),permMatch=document.getElementById('perm-match'),permPickAll=document.getElementById('perm-pick-all');
var permTabs=document.getElementById('perm-tabs'),permSub=document.getElementById('perm-sub'),permLeftTitle=document.getElementById('perm-left-title'),permPickedTitle=document.getElementById('perm-picked-title');
var editingRoleId=null,draftByType={},activeType=DATA_TYPES[0].key,lastFocus=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showToast(message,type){var el=document.getElementById('toast');el.textContent=message;el.className='toast '+(type||'ok');el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.style.display='none';},2200);}
function loadScopes(){try{var raw=localStorage.getItem(STORE_KEY);if(raw){var d=JSON.parse(raw);if(d&&typeof d==='object')return d;}}catch(e){}return {};}
function saveScopes(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
function pageCount(){return Math.max(1,Math.ceil(ROLES.length/PAGE_SIZE));}
function render(){
  var start=(page-1)*PAGE_SIZE,list=ROLES.slice(start,start+PAGE_SIZE);
  tbody.innerHTML=list.map(function(r){
    return '<tr><td class="weak">'+r.id+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.code)+'</td><td>'+esc(r.creator)+'</td><td class="weak">'+esc(r.createdAt)+'</td><td>'+esc(r.updater)+'</td><td class="weak">'+esc(r.updatedAt)+'</td>'+
      '<td><button type="button" class="op-btn js-nothing">编辑</button><button type="button" class="op-btn danger js-nothing">删除</button><button type="button" class="op-btn btn-perm" data-id="'+r.id+'" id="btn-perm-'+r.id+'">数据权限</button></td></tr>';
  }).join('');
  document.getElementById('pager-total').textContent='共 '+ROLES.length+' 条';
  var total=pageCount(),nums='';
  for(var i=1;i<=total;i++)nums+='<button type="button" class="page-num'+(i===page?' active':'')+'" data-page="'+i+'">'+i+'</button>';
  document.getElementById('page-nums').innerHTML=nums;
  document.getElementById('page-prev').disabled=page<=1;
  document.getElementById('page-next').disabled=page>=total;
  document.getElementById('page-jump').value=String(page);
  bind();
}
function bind(){
  tbody.querySelectorAll('.js-nothing').forEach(function(b){b.onclick=function(){showToast('该入口不在本次原型演示范围内','info');};});
  tbody.querySelectorAll('.btn-perm').forEach(function(b){b.onclick=function(){openModal(Number(b.dataset.id));};});
  document.querySelectorAll('#page-nums .page-num').forEach(function(b){b.onclick=function(){page=Number(b.dataset.page);render();};});
}
function currentType(){
  for(var i=0;i<DATA_TYPES.length;i++){if(DATA_TYPES[i].key===activeType)return DATA_TYPES[i];}
  return DATA_TYPES[0];
}
function draft(){
  if(!draftByType[activeType])draftByType[activeType]=[];
  return draftByType[activeType];
}
function typeItems(){return currentType().items||[];}
function itemById(id){return typeItems().filter(function(a){return a.id===id;})[0];}
function visibleItems(){
  var q=(permSearch.value||'').trim().toLowerCase();
  if(!q)return typeItems().slice();
  return typeItems().filter(function(a){return String(a.name).toLowerCase().indexOf(q)>=0||String(a.id).toLowerCase().indexOf(q)>=0;});
}
function renderTypeTabs(){
  permTabs.innerHTML=DATA_TYPES.map(function(t){
    var on=t.key===activeType;
    return '<button type="button" class="perm-tab'+(on?' on':'')+'" role="tab" aria-selected="'+on+'" data-key="'+esc(t.key)+'">'+esc(t.label)+'</button>';
  }).join('');
  permTabs.querySelectorAll('.perm-tab').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.key===activeType)return;
      activeType=b.dataset.key;permSearch.value='';
      renderTypeTabs();applyType();
    });
  });
}
function applyType(){
  var t=currentType();
  permSub.textContent=t.desc||'';
  permLeftTitle.textContent=t.leftTitle||t.label;
  permPickedTitle.textContent=t.pickedTitle||'已选';
  permSearch.placeholder=t.searchPlaceholder||'搜索';
  renderPermList();
}
function renderPermList(){
  var t=currentType(),d=draft(),unit=t.unit||'条',noun=t.noun||unit,keyword=(permSearch.value||'').trim(),list=visibleItems(),all=typeItems();
  permMatch.textContent=keyword?('匹配 '+list.length+' '+unit):('共 '+all.length+' '+unit);
  var allPicked=list.length>0&&list.every(function(a){return d.indexOf(a.id)>=0;});
  permPickAll.disabled=!list.length;
  permPickAll.textContent=allPicked?'取消全选':'全选';
  if(!all.length){permList.innerHTML='<div class="xfer-empty">'+esc(t.emptyText||'暂无可选数据')+'</div>';}
  else if(!list.length){permList.innerHTML='<div class="xfer-empty">没有匹配「'+esc(keyword)+'」的'+esc(noun)+'</div>';}
  else{
    permList.innerHTML=list.map(function(a){
      var on=d.indexOf(a.id)>=0;
      return '<div class="xfer-item'+(on?' on':'')+'" data-id="'+esc(a.id)+'" role="button" tabindex="0" aria-pressed="'+on+'" title="'+(on?'点击移出已选':'点击加入已选')+'"><span class="xfer-name">'+esc(a.name)+'</span><span class="xfer-id">'+esc(a.id)+'</span><span class="xfer-flag'+(on?'':' plus')+'">'+(on?'已选':'＋')+'</span></div>';
    }).join('');
    bindXferItems(permList,function(id){toggleItem(id,draft().indexOf(id)<0);renderPermList();});
  }
  renderPicked();
  syncPermState();
}
function renderPicked(){
  var t=currentType(),d=draft(),noun=t.noun||'数据';
  if(!d.length){permPicked.innerHTML='<div class="xfer-empty">尚未选择'+esc(noun)+'<br>点击左侧'+esc(noun)+'即可添加</div>';return;}
  permPicked.innerHTML=d.map(function(id){
    var a=itemById(id);if(!a)return '';
    return '<div class="xfer-item" data-id="'+esc(a.id)+'" role="button" tabindex="0" title="点击移出已选"><span class="xfer-name">'+esc(a.name)+'</span><span class="xfer-id">'+esc(a.id)+'</span><span class="xfer-x">×</span></div>';
  }).join('');
  bindXferItems(permPicked,function(id){toggleItem(id,false);renderPermList();});
}
function bindXferItems(container,handler){
  container.querySelectorAll('.xfer-item').forEach(function(el){
    el.addEventListener('click',function(){handler(el.dataset.id);});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();handler(el.dataset.id);}});
  });
}
function syncPermState(){
  permTip.textContent='已选 '+draft().length+' / '+typeItems().length+' '+(currentType().unit||'条');
}
function toggleItem(id,checked){
  var d=draft(),i=d.indexOf(id);
  if(checked&&i<0)d.push(id);
  if(!checked&&i>=0)d.splice(i,1);
  syncPermState();
}
function openModal(roleId){
  var role=ROLES.filter(function(r){return r.id===roleId;})[0];if(!role)return;
  editingRoleId=roleId;lastFocus=document.activeElement;
  var saved=loadScopes()[roleId],byType={};
  if(Object.prototype.toString.call(saved)==='[object Array]'){byType[DATA_TYPES[0].key]=saved.slice();}
  else if(saved&&typeof saved==='object'){byType=saved;}
  draftByType={};
  DATA_TYPES.forEach(function(t){draftByType[t.key]=(byType[t.key]||[]).slice();});
  activeType=DATA_TYPES[0].key;
  permTitle.textContent='设置数据权限';
  permSearch.value='';
  renderTypeTabs();
  applyType();
  modal.classList.add('active');
  setTimeout(function(){permSearch.focus();},0);
}
function closeModal(){modal.classList.remove('active');draftByType={};editingRoleId=null;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
permSearch.addEventListener('input',function(){renderPermList();});
permSearch.addEventListener('keydown',function(e){if(e.key==='Escape'){permSearch.value='';renderPermList();}});
permPickAll.addEventListener('click',function(){
  var list=visibleItems(),d=draft(),allPicked=list.length>0&&list.every(function(a){return d.indexOf(a.id)>=0;});
  list.forEach(function(a){
    var i=d.indexOf(a.id);
    if(allPicked){if(i>=0)d.splice(i,1);}
    else if(i<0)d.push(a.id);
  });
  renderPermList();
});
document.getElementById('perm-clear').addEventListener('click',function(){draftByType[activeType]=[];renderPermList();});
document.getElementById('perm-save').addEventListener('click',function(){
  if(editingRoleId==null)return;
  var scopes=loadScopes(),out={};
  DATA_TYPES.forEach(function(t){out[t.key]=(draftByType[t.key]||[]).slice();});
  scopes[editingRoleId]=out;saveScopes(scopes);
  closeModal();showToast('保存成功','ok');
});
document.getElementById('perm-close').addEventListener('click',closeModal);
document.getElementById('perm-cancel').addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){
  if(!modal.classList.contains('active'))return;
  if(e.key==='Escape'){closeModal();return;}
  if(e.key==='Tab'){
    var controls=[document.getElementById('perm-close')]
      .concat([].slice.call(permTabs.querySelectorAll('.perm-tab')),[permSearch,permPickAll],
        [].slice.call(permList.querySelectorAll('.xfer-item')),
        [].slice.call(permPicked.querySelectorAll('.xfer-item')),
        [document.getElementById('perm-clear'),document.getElementById('perm-cancel'),document.getElementById('perm-save')]);
    var first=controls[0],last=controls[controls.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
document.getElementById('page-prev').addEventListener('click',function(){if(page>1){page--;render();}});
document.getElementById('page-next').addEventListener('click',function(){if(page<pageCount()){page++;render();}});
document.getElementById('page-jump').addEventListener('change',function(){var v=parseInt(document.getElementById('page-jump').value,10);if(v>=1&&v<=pageCount()){page=v;render();}else{document.getElementById('page-jump').value=String(page);}});
document.getElementById('page-size').addEventListener('change',function(){PAGE_SIZE=parseInt(this.value,10)||10;page=1;render();});
document.querySelectorAll('.nav-group').forEach(function(el){
  var children=document.getElementById(el.dataset.target);
  function toggle(){var open=!el.classList.contains('open');el.classList.toggle('open',open);children.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));}
  el.addEventListener('click',toggle);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
});
document.querySelectorAll('.js-nothing').forEach(function(el){el.addEventListener('click',function(){showToast('该入口不在本次原型演示范围内','info');});});
render();
var params=new URLSearchParams(location.search);
var focusId=params.get('focus');if(focusId&&document.getElementById(focusId))document.getElementById(focusId).classList.add('focus-target');
if(params.get('open')==='1'){var first=ROLES[0];if(first)openModal(first.id);}
})();
</script>

</body>
