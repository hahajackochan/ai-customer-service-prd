<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 会话接待插件H5 v1.0（艾客客服端内嵌面板）</title>
<style>
:root{--ink:#303133;--muted:#606266;--weak:#909399;--line:#ebeef4;--head:#f5f7fa;--brand:#a86115;--brand-soft:#fcebd8;--green:#18aa92;--blue:#409eff;--danger:#f56c6c;--bg:#eef1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.panel{max-width:430px;margin:0 auto;min-height:100vh;background:#f7f8fa;display:flex;flex-direction:column;box-shadow:0 0 24px rgba(16,24,40,.08);position:relative}
.p-head{background:linear-gradient(135deg,#7c4a03,#a86115);color:#fff;padding:14px 16px 12px}
.p-head .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.p-head h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.p-head h1 .dot{width:8px;height:8px;border-radius:50%;background:#7ef0c8;box-shadow:0 0 0 3px rgba(126,240,200,.25)}
.p-head .sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
.acct-select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;height:32px;padding:0 8px;font-size:13px;max-width:170px}
.acct-select option{color:#303133}
.card{background:#fff;border-radius:12px;margin:10px 12px 0;padding:12px 14px;box-shadow:0 1px 4px rgba(16,24,40,.05)}
.card h3{margin:0 0 8px;font-size:13px;color:var(--weak);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv .name{font-size:15px;font-weight:700}
.kv .meta{font-size:12px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;min-height:22px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px}
.tag.on{background:#e7f7f4;color:#0e8a76;border:1px solid #bfe9e0}
.tag.off{background:#f4f4f5;color:#909399;border:1px solid #e5e7eb}
.tag.type{background:#fdf1e8;color:#a86115;border:1px solid #f3ddc2}
/* 开关 */
.sw{position:relative;width:44px;height:24px;border-radius:12px;background:#dcdfe6;border:none;cursor:pointer;transition:background .2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--green)}
.sw.on::after{left:22px}
.sw:disabled{opacity:.45;cursor:not-allowed}
.sw.busy{opacity:.7;pointer-events:none}
.reason{font-size:12px;color:#b88230;background:#fffaf2;border:1px dashed #eed9b7;border-radius:6px;padding:4px 8px;margin-top:8px;display:none}
.reason.show{display:block}
/* 搜索 */
.tabs{display:flex;gap:8px;margin:2px 0 10px}
.tab-btn{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;cursor:pointer}
.tab-btn.active{background:var(--brand-soft);border-color:#e8c99f;color:#7c4a03;font-weight:700}
.tab-btn .cnt{font-size:11px;color:var(--weak);margin-left:4px}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 30px 0 10px;font-size:13px;outline:none;background:#fff}
.search input:focus{border-color:#e8c99f}
.search .clear{position:absolute;right:6px;top:6px;width:22px;height:22px;border:none;background:#f0f2f5;border-radius:50%;color:var(--weak);cursor:pointer;font-size:12px;line-height:1;display:none}
.bulk-acts{display:flex;gap:8px;margin-bottom:8px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger-soft{background:#fef0f0;border-color:#f3b8b8;color:#c45656}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.mini{height:28px;font-size:12px;padding:0 10px}
/* 列表 */
.slist{display:flex;flex-direction:column;gap:8px;min-height:120px}
.srow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.srow:hover{border-color:#e8c99f}
.srow.current{border-color:var(--brand);box-shadow:0 0 0 2px rgba(168,97,21,.12)}
.srow input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);flex:0 0 auto}
.srow .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f3ddc2,#fcebd8);color:#7c4a03;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.srow.group .avatar{background:linear-gradient(135deg,#cfe4f7,#e3f0fb);color:#2c5d84}
.srow .body{flex:1;min-width:0}
.srow .n1{display:flex;align-items:center;gap:6px}
.srow .sname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .n2{font-size:12px;color:var(--weak);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.empty{text-align:center;color:var(--weak);font-size:13px;padding:26px 0}
.skeleton{height:64px;border-radius:10px;background:linear-gradient(90deg,#f0f2f5 25%,#fafbfc 40%,#f0f2f5 55%);background-size:300% 100%;animation:sk 1.1s infinite;margin-bottom:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.batch-bar{position:sticky;bottom:10px;margin:10px 12px 14px;background:#303133;color:#fff;border-radius:10px;padding:8px 12px;display:none;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.batch-bar.show{display:flex}
.batch-bar .cnt{font-size:13px;flex:1}
.batch-bar .btn{height:30px}
.p-foot{padding:10px 14px 18px;text-align:center;font-size:11px;color:#b0b6bf}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.active{display:flex}
.mbox{width:min(88vw,360px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mhead{padding:14px 16px 6px;font-size:15px;font-weight:700}
.mbody{padding:6px 16px 4px;font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--brand)}
.opt .t{font-weight:600;color:var(--ink)}
.opt .d{font-size:12px;color:var(--weak)}
.opt input:disabled+span{color:var(--weak)}
.merr{color:var(--danger);font-size:12px;min-height:18px;margin-top:2px}
.mfoot{display:flex;gap:10px;padding:10px 16px 16px}
.mfoot .btn{flex:1;height:38px;font-size:14px}
/* toast */
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;display:none;z-index:99;max-width:86vw;text-align:center}
.toast.ok{background:rgba(14,138,118,.92)}
.toast.err{background:rgba(196,86,86,.94)}
.toast.info{background:rgba(15,23,42,.88)}
</style>
</head>
<body>
<div class="panel">
  <header class="p-head">
    <div class="row1">
      <div>
        <h1><span class="dot"></span>AI客服助手</h1>

      </div>
    </div>
  </header>

  <section class="card" aria-label="账号AI托管">
    <h3>账号AI托管</h3>
    <div class="kv">
      <div>
        <div class="name" id="acct-name">—</div>
        <div class="meta" id="acct-meta">—</div>
      </div>
      <button type="button" class="sw" id="acct-sw" role="switch" aria-label="账号AI托管开关"></button>
    </div>
    <div class="tags" id="acct-tags"></div>
    <div class="reason" id="acct-reason"></div>
  </section>

  <section class="card" aria-label="当前会话AI接管">
    <h3>当前会话</h3>
    <div class="kv">
      <div style="min-width:0">
        <div class="name" id="cur-name" style="display:flex;align-items:center;gap:6px">—</div>
        <div class="meta" id="cur-meta">—</div>
      </div>
      <button type="button" class="sw" id="cur-sw" role="switch" aria-label="当前会话AI接管开关"></button>
    </div>
    <div class="reason" id="cur-reason"></div>
  </section>

  <section class="card" aria-label="会话列表">
    <h3>会话AI接管设置</h3>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-single">单聊<span class="cnt" id="cnt-single"></span></button>
      <button type="button" class="tab-btn" id="tab-group" disabled aria-disabled="true" title="后续版本支持">群聊<span class="cnt">（后续）</span></button>
    </div>
    <div class="search">
      <input id="q" placeholder="搜索会话名称" autocomplete="off">
      <button type="button" class="clear" id="q-clear" aria-label="清空搜索">×</button>
    </div>
    <div class="bulk-acts">
      <button type="button" class="btn green mini" id="all-on">全部开启AI接管</button>
      <button type="button" class="btn danger-soft mini" id="all-off">全部禁用AI接管</button>
    </div>
    <div class="slist" id="slist"></div>
  </section>

  <div class="batch-bar" id="batch-bar">
    <span class="cnt" id="batch-cnt">已选 0 项</span>
    <button type="button" class="btn green mini" id="batch-on">开启接管</button>
    <button type="button" class="btn danger-soft mini" id="batch-off">禁用接管</button>
    <button type="button" class="btn mini" id="batch-cancel" style="background:transparent;border-color:rgba(255,255,255,.4);color:#fff">取消</button>
  </div>

  <div class="p-foot">原型演示 · 数据为模拟示例，与AI托管账号 / 客户会话管理原型共享状态</div>
</div>

<div class="modal" id="m-modes">
  <div class="mbox">
    <div class="mhead">开启账号AI托管</div>
    <div class="mbody">
      <div>请选择AI托管方式（可同时勾选，至少一项）：</div>
      <label class="opt"><input type="checkbox" id="opt-single"><span><span class="t">单聊AI托管</span><br><span class="d">对账号下单聊会话开放AI接管</span></span></label>
      <label class="opt"><input type="checkbox" id="opt-group"><span><span class="t">群聊AI托管</span><br><span class="d">对账号下群聊会话开放AI接管</span></span></label>
      <div class="merr" id="modes-err"></div>
    </div>
    <div class="mfoot"><button type="button" class="btn" id="modes-cancel">取消</button><button type="button" class="btn primary" id="modes-ok">确定</button></div>
  </div>
</div>

<div class="modal" id="m-confirm">
  <div class="mbox">
    <div class="mhead" id="cf-title">确认操作</div>
    <div class="mbody" id="cf-text"></div>
    <div class="merr" id="cf-err" style="padding:0 16px"></div>
    <div class="mfoot"><button type="button" class="btn" id="cf-cancel">取消</button><button type="button" class="btn primary" id="cf-ok">确定</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
/* ---------- 共享模拟状态（与AI托管账号 / 客户会话管理原型一致） ---------- */
const params=new URLSearchParams(location.search);
let state={accounts:{},sessions:{}};
try{const x=JSON.parse(params.get('demo')||localStorage.getItem('aic-v05')||'null');if(x&&typeof x==='object'){state.accounts=x.accounts||{};state.sessions=x.sessions||{};}}catch(_){}
let h5={currentAccount:'wx_1001',currentSession:'S_0001'};
try{const y=JSON.parse(localStorage.getItem('aic-h5')||'null');if(y&&typeof y==='object')h5=Object.assign(h5,y);}catch(_){}

const ACCOUNTS=Array.from({length:9},(_,i)=>({id:'wx_100'+(i+1),name:'会员助理 小菲'+(i+1),hosted:[1,2,5,6,8].includes(i+1),single:[1,2,5,6].includes(i+1),group:[1,6,8].includes(i+1)}));
const NAMES=['王女士','李先生','张女士','赵先生','刘女士','陈先生','孙女士','周先生','吴女士','郑先生','冯女士','蒋先生'];
const MIDS=[1,1,2,3,4,4,5,6,7,8,9,5];
const SUMMARIES=['想了解会员权益。','积分在哪里查看？','我想预约到店看看柜体颜色。','订单的安装进度在哪里看？','积分过期规则是什么？','我能修改预约时间吗？','门店营业时间几点？','怎么样参加本月活动？','发票怎么开具？','运费如何计算？','套餐可以升级吗？','地址可以修改吗？'];
const singles=NAMES.map((name,i)=>({id:'S_'+String(i+1).padStart(4,'0'),name:name,cid:'C_'+(88001+i),mid:'wx_100'+MIDS[i],kind:'single',summary:SUMMARIES[i],configured:i%3!==1}));

function account(id){const base=ACCOUNTS.find(a=>a.id===id);const raw=state.accounts[id];return raw&&typeof raw==='object'?Object.assign({},base,{hosted:raw.hosted===true,single:raw.single===true,group:raw.group===true}):Object.assign({},base);}
function saveShared(){const value=JSON.stringify(state);try{localStorage.setItem('aic-v05',value);}catch(_){} params.set('demo',value);try{const u=new URL(location.href);u.searchParams.set('demo',value);history.replaceState(null,'',u.href);}catch(_){}}
function saveH5(){try{localStorage.setItem('aic-h5',JSON.stringify(h5));}catch(_){}}
function saveAccount(id,cfg){state.accounts[id]={hosted:!!cfg.hosted,single:!!cfg.single,group:!!cfg.group};saveShared();}
function saveSession(id,val){state.sessions[id]=!!val;saveShared();}

/* ---------- DOM ---------- */
const $=s=>document.querySelector(s);
const acctSw=$('#acct-sw'),curSw=$('#cur-sw');
let checked=new Set(),busy=false;
function toast(msg,cls){const t=$('#toast');t.textContent=msg;t.className='toast '+(cls||'info');t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.display='none'},2200);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtName(n){return (n||'').replace(/^会员助理s*/,'').slice(0,2)||'客';}

/* ---------- 渲染 ---------- */
function renderAcct(){
  const a=account(h5.currentAccount);
  $('#acct-name').textContent=a.name;
  $('#acct-meta').textContent='账号ID '+a.id;
  acctSw.classList.toggle('on',a.hosted);
  acctSw.setAttribute('aria-checked',String(a.hosted));
  acctSw.disabled=busy;
  const tags=[];
  if(a.hosted)tags.push(a.single?'<span class="tag on">单聊托管</span>':'<span class="tag off">未开启单聊托管</span>');
  $('#acct-tags').innerHTML=tags.join('');
  const r=$('#acct-reason');
  if(a.hosted&&!a.single){r.textContent='账号未开启单聊托管，会话AI接管暂不可用。';r.classList.add('show');}
  else r.classList.remove('show');
}
function sessionAllowed(s,a){
  if(!a.hosted)return {ok:false,why:'账号未开启AI托管'};
  if(!a.single)return {ok:false,why:'账号未勾选「单聊AI托管」'};
  return {ok:true};
}
function sessionOn(s){return state.sessions[s.id]!==undefined?state.sessions[s.id]===true:s.configured;}
function setSession(s,val){saveSession(s.id,val);}
function currentSession(){
  const a=account(h5.currentAccount);
  return singles.find(s=>s.id===h5.currentSession)||singles[0];
}
function renderCurrent(){
  const a=account(h5.currentAccount),s=currentSession();
  $('#cur-name').innerHTML=esc(s.name)+' <span class="tag type">单聊</span>';
  $('#cur-meta').textContent='客户 '+s.cid+' ｜ 成员账号 '+a.name;
  const allow=sessionAllowed(s,a);
  curSw.classList.toggle('on',sessionOn(s));
  curSw.setAttribute('aria-checked',String(sessionOn(s)));
  curSw.disabled=busy||!allow.ok;
  const r=$('#cur-reason');
  if(!allow.ok){r.textContent=allow.why+'，当前会话不可开启AI接管。';r.classList.add('show');}
  else r.classList.remove('show');
}
function visibleList(){
  const kw=($('#q').value||'').trim();
  let list=singles;
  if(kw)list=list.filter(s=>s.name.indexOf(kw)>=0);
  return list.slice().sort((a,b)=>String(b.id).localeCompare(String(a.id)));
}
function renderList(){
  const a=account(h5.currentAccount),list=visibleList();
  const el=$('#slist');
  if(!list.length){
    el.innerHTML='<div class="empty">'+(($('#q').value||'').trim()?'未找到匹配会话，可修改关键词或重置搜索':'该账号暂无单聊会话')+'</div>';
  }else{
    el.innerHTML=list.map(s=>{
      const allow=sessionAllowed(s,a),on=sessionOn(s);
      return '<div class="srow'+(s.id===h5.currentSession?' current':'')+'" data-id="'+s.id+'" role="button" tabindex="0">'
        +'<input type="checkbox" data-chk="'+s.id+'" '+(checked.has(s.id)?'checked':'')+' aria-label="选择 '+esc(s.name)+'"'
        +(allow.ok?'':' disabled')+'>'
        +'<span class="avatar">'+esc(fmtName(s.name))+'</span>'
        +'<span class="body"><span class="n1"><span class="sname">'+esc(s.name)+'</span></span>'
        +'<span class="n2">'+esc(s.summary)+'</span></span>'
        +'<button type="button" class="sw'+(on?' on':'')+'" data-sw="'+s.id+'"'+(allow.ok?'':' disabled')+' aria-label="'+esc(s.name)+' AI接管开关"></button>'
        +(!allow.ok&&a.hosted?'<span class="reason show" style="margin:0 0 0 6px;max-width:96px">'+allow.why+'</span>':'')
        +'</div>';
    }).join('');
  }
  renderBulk();
  renderCounts();
}
function renderCounts(){
  const a=account(h5.currentAccount);
  const list=singles;
  $('#cnt-single').textContent='（'+list.length+'）';
  const eligible=list.filter(s=>sessionAllowed(s,a).ok);
  const on=eligible.filter(s=>sessionOn(s));
  $('#all-on').disabled=busy||!a.hosted||eligible.length===on.length||!eligible.length;
  $('#all-off').disabled=busy||!a.hosted||on.length===0;
}
function renderBulk(){
  const bar=$('#batch-bar'),n=checked.size;
  bar.classList.toggle('show',n>0);
  $('#batch-cnt').textContent='已选 '+n+' 项';
  const a=account(h5.currentAccount);
  const sel=[...checked].map(id=>singles.find(s=>s.id===id)).filter(Boolean);
  const el=sel.filter(s=>sessionAllowed(s,a).ok);
  $('#batch-on').disabled=busy||!el.length||el.every(s=>sessionOn(s));
  $('#batch-off').disabled=busy||!el.filter(s=>sessionOn(s)).length;
  $('#batch-on').textContent=el.length&&sel.length!==el.length?('开启接管（'+el.length+'可操作）'):'开启接管';
  $('#batch-off').textContent=el.length&&sel.length!==el.length?('禁用接管（'+el.length+'可操作）'):'禁用接管';
}
function renderAll(){renderAcct();renderCurrent();renderList();}

/* ---------- 弹窗 ---------- */
function openModal(id){$(id).classList.add('active');}
function closeModal(id){$(id).classList.remove('active');}

/* 账号开关 */
acctSw.addEventListener('click',()=>{
  if(busy)return;
  const a=account(h5.currentAccount);
  if(!a.hosted){
    $('#opt-single').checked=a.single;$('#opt-group').checked=a.group;$('#modes-err').textContent='';
    openModal('#m-modes');$('#opt-single').focus();
  }else{
    $('#cf-title').textContent='关闭账号AI托管';
    $('#cf-text').innerHTML='关闭后该账号<b>全部单聊会话</b>将停止AI接管。<br>确定关闭「'+esc(a.name)+'」的AI托管吗？';
    $('#cf-err').textContent='';$('#cf-ok').dataset.act='acct-off';
    openModal('#m-confirm');
  }
});
$('#modes-ok').addEventListener('click',()=>{
  const single=$('#opt-single').checked,group=$('#opt-group').checked;
  if(!single&&!group){$('#modes-err').textContent='开启AI托管后，请至少勾选一种托管方式';return;}
  setBusy(true);
  setTimeout(()=>{
    saveAccount(h5.currentAccount,{hosted:true,single:single,group:group});
    setBusy(false);closeModal('#m-modes');renderAll();
    toast('AI托管已开启','ok');
  },420);
});
$('#modes-cancel').addEventListener('click',()=>closeModal('#m-modes'));
$('#cf-ok').addEventListener('click',()=>{
  const act=$('#cf-ok').dataset.act;
  if(act==='acct-off'){
    setBusy(true);
    setTimeout(()=>{
      saveAccount(h5.currentAccount,{hosted:false,single:false,group:false});
      setBusy(false);closeModal('#m-confirm');renderAll();
      toast('AI托管已关闭','ok');
    },420);
  }else if(act==='all'){
    const val=$('#cf-ok').dataset.val==='on';
    const list=singles.filter(s=>sessionAllowed(s,account(h5.currentAccount)).ok);
    batchApply(list,val,true);
  }else if(act==='batch'){
    const val=$('#cf-ok').dataset.val==='on';
    const a=account(h5.currentAccount);
    const list=[...checked].map(id=>singles.find(s=>s.id===id)).filter(s=>s&&sessionAllowed(s,a).ok);
    batchApply(list,val,false);
  }
});
$('#cf-cancel').addEventListener('click',()=>closeModal('#m-confirm'));

function setBusy(v){busy=v;acctSw.disabled=v||!account(h5.currentAccount).hosted;renderCounts();renderBulk();}

/* 单个会话开关（事件委托） */
$('#slist').addEventListener('click',e=>{
  const sw=e.target.closest('[data-sw]');
  if(sw){
    if(busy||sw.disabled)return;
    const id=sw.getAttribute('data-sw');
    const s=singles.find(x=>x.id===id);
    const next=!sessionOn(s);
    sw.classList.add('busy');
    setTimeout(()=>{
      setSession(s,next);
      renderAll();
      toast(next?'已开启「'+s.name+'」AI接管':'已禁用「'+s.name+'」AI接管',next?'ok':'info');
    },260);
    return;
  }
  const row=e.target.closest('.srow');
  if(row&&!e.target.matches('input[type=checkbox]')){
    h5.currentSession=row.getAttribute('data-id');saveH5();renderAll();
    toast('已切换当前会话','info');
  }
});
$('#slist').addEventListener('change',e=>{
  const chk=e.target.closest('[data-chk]');
  if(!chk)return;
  const id=chk.getAttribute('data-chk');
  if(chk.checked)checked.add(id);else checked.delete(id);
  renderBulk();
});
curSw.addEventListener('click',()=>{
  if(busy||curSw.disabled)return;
  const s=currentSession(),next=!sessionOn(s);
  curSw.classList.add('busy');
  setTimeout(()=>{setSession(s,next);renderAll();toast(next?'当前会话已开启AI接管':'当前会话已禁用AI接管',next?'ok':'info');},260);
});

/* 一键 */
$('#all-on').addEventListener('click',()=>{
  const list=singles.filter(s=>sessionAllowed(s,account(h5.currentAccount)).ok&&!sessionOn(s));
  if(!list.length)return;
  $('#cf-title').textContent='全部开启AI接管';
  $('#cf-text').innerHTML='将对该账号下<b>'+list.length+'个单聊会话</b>一键开启AI接管。<br>确定继续吗？';
  $('#cf-err').textContent='';$('#cf-ok').dataset.act='all';$('#cf-ok').dataset.val='on';
  openModal('#m-confirm');
});
$('#all-off').addEventListener('click',()=>{
  const list=singles.filter(s=>sessionAllowed(s,account(h5.currentAccount)).ok&&sessionOn(s));
  if(!list.length)return;
  $('#cf-title').textContent='全部禁用AI接管';
  $('#cf-text').innerHTML='将对该账号下<b>'+list.length+'个单聊会话</b>一键禁用AI接管。<br>确定继续吗？';
  $('#cf-err').textContent='';$('#cf-ok').dataset.act='all';$('#cf-ok').dataset.val='off';
  openModal('#m-confirm');
});
function batchApply(list,val,clearAfter){
  if(!list.length){closeModal('#m-confirm');toast('没有可操作的会话','err');return;}
  setBusy(true);
  setTimeout(()=>{
    list.forEach(s=>setSession(s,val));
    if(clearAfter)checked.clear();else list.forEach(s=>checked.delete(s.id));
    setBusy(false);closeModal('#m-confirm');renderAll();
    toast((val?'已开启 ':'已禁用 ')+list.length+' 个会话AI接管','ok');
  },520);
}

/* 批量 */
$('#batch-on').addEventListener('click',()=>{
  const a=account(h5.currentAccount);
  const sel=[...checked].map(id=>singles.find(s=>s.id===id)).filter(Boolean);
  const el=sel.filter(s=>sessionAllowed(s,a).ok&&!sessionOn(s));
  if(!el.length)return;
  $('#cf-title').textContent='批量开启AI接管';
  $('#cf-text').innerHTML='将对勾选的<b>'+el.length+'个会话</b>开启AI接管'+(sel.length!==el.length?'（其余'+(sel.length-el.length)+'个不满足前提已跳过）':'')+'。<br>确定继续吗？';
  $('#cf-err').textContent='';$('#cf-ok').dataset.act='batch';$('#cf-ok').dataset.val='on';
  openModal('#m-confirm');
});
$('#batch-off').addEventListener('click',()=>{
  const a=account(h5.currentAccount);
  const sel=[...checked].map(id=>singles.find(s=>s.id===id)).filter(Boolean);
  const el=sel.filter(s=>sessionAllowed(s,a).ok&&sessionOn(s));
  if(!el.length)return;
  $('#cf-title').textContent='批量禁用AI接管';
  $('#cf-text').innerHTML='将对勾选的<b>'+el.length+'个会话</b>禁用AI接管'+(sel.length!==el.length?'（其余'+(sel.length-el.length)+'个不满足前提已跳过）':'')+'。<br>确定继续吗？';
  $('#cf-err').textContent='';$('#cf-ok').dataset.act='batch';$('#cf-ok').dataset.val='off';
  openModal('#m-confirm');
});
$('#batch-cancel').addEventListener('click',()=>{checked.clear();renderAll();});

/* 搜索 */
$('#q').addEventListener('input',()=>{$('#q-clear').style.display=$('#q').value?'block':'none';renderList();});
$('#q-clear').addEventListener('click',()=>{$('#q').value='';$('#q-clear').style.display='none';renderList();$('#q').focus();});

/* 键盘可达：Enter/空格切换行 */
$('#slist').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('srow')){e.preventDefault();e.target.click();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('#m-modes');closeModal('#m-confirm');}});

/* 首次进入骨架屏 */
$('#slist').innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
setTimeout(renderAll,380);
})();
</script>
</body>
</html>
