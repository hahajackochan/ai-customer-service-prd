<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 智能体管理 v1.0（中台后台样式）</title>
<style>
:root{--brand:#a86115;--amber:#f9ecc9;--ink:#303133;--text:#4a4f55;--muted:#606266;--weak:#909399;--line:#ebeef4;--head:#f2f5f9;--page:#f0f1f2;--danger:#f56c6c;--ok:#67c23a;--blue:#6f8db5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}
.topbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 24px;position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:12px;white-space:nowrap}.logo svg{width:34px;height:34px}.logo b{font-size:18px;font-weight:700;color:#3a3f45;letter-spacing:1px}
.top-tabs{display:flex;align-items:center;gap:14px;margin-left:56px}.top-tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:4px;color:var(--text);cursor:pointer;user-select:none}.top-tab svg{width:16px;height:16px}.top-tab.active{background:var(--amber);color:#5c4a1e;font-weight:600}
.tenant-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-weight:600;cursor:pointer;user-select:none}.tenant-pill .caret{font-size:10px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--ink);white-space:nowrap}.avatar{width:30px;height:30px;border-radius:50%;background:#e8eaed;display:inline-flex;align-items:center;justify-content:center;color:#aeb4bc}.quit{color:var(--blue);cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:224px;height:calc(100vh - 64px);position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex:0 0 auto;overflow-y:auto}
.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#3f444a;cursor:pointer;user-select:none;background:transparent}.nav-item svg{width:17px;height:17px;flex:0 0 auto;color:#5b6167}.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-item .chev{color:#b9bec4;font-size:11px;transition:transform .2s}.nav-item.open .chev{transform:rotate(180deg)}.nav-item:hover{background:#f7f8f9}
.nav-item.child{padding-left:42px}.nav-item.child.ai-child{padding-left:38px;font-size:13px}.nav-item.child .dot-ic{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;color:#9aa0a6;flex:0 0 auto}.nav-item.child.active{background:var(--amber);color:#6b4410;font-weight:600}.nav-item.child.active .dot-ic{color:var(--brand)}
.nav-children{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}.nav-children.open{grid-template-rows:1fr}.nav-children-inner{min-height:0;overflow:hidden}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.crumb-bar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}.collapse-ic{display:inline-flex;color:#3f444a;cursor:pointer}.crumb{color:#3f444a}.crumb b{color:#6b4410;font-weight:600}
.tab-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}.tab-nav{color:#b9bec4;font-size:16px;cursor:pointer}.tab{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;background:var(--amber);color:#6b4410;font-size:13px;font-weight:600}.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}.tab .x{cursor:pointer;opacity:.7}
.page-body{padding:18px 20px;flex:1;min-width:0}.card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(31,41,55,.04);margin-bottom:14px}.filter-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}.fitem{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.fitem input{width:190px;height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:var(--ink);outline:none}.fitem input:focus,.field input:focus,.field select:focus{border-color:var(--brand)}.factions{display:inline-flex;gap:10px}.toolbar{display:flex;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.toolbar-actions{margin-left:auto;display:flex;gap:12px}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:13px}.btn:hover{color:var(--brand);border-color:#e3c692}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:#8f5212;color:#fff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(31,41,55,.04);overflow:auto}table{width:100%;border-collapse:collapse;table-layout:auto}th{height:46px;background:var(--head);color:#5b6167;font-weight:600;border-bottom:1px solid var(--line);text-align:left;padding:0 14px;white-space:nowrap}td{height:52px;border-bottom:1px solid var(--line);padding:0 14px;color:var(--muted);vertical-align:middle;white-space:nowrap}tr:last-child td{border-bottom:0}tr:hover td{background:#fdf9f0}td.weak{color:var(--weak)}td.strong{color:var(--ink)}.key-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4d5359}.secret-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#767d85;letter-spacing:.35px}.action-link{border:0;background:none;padding:2px 0;color:var(--brand);cursor:pointer}.action-link:hover{text-decoration:underline}.empty-row td{text-align:center;color:var(--weak);height:84px}
.pager{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);border-top:1px solid var(--line)}.page-size{height:30px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;display:inline-flex;align-items:center;padding:0 12px;font-size:13px}.page-num{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);border:1px solid transparent;background:#fff}.page-num.active{background:var(--brand);color:#fff}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.45);display:none;align-items:center;justify-content:center;z-index:100}.modal.active{display:flex}.modal-box{width:480px;background:#fff;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.18);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}.modal-close{border:0;background:transparent;font-size:20px;color:var(--weak);cursor:pointer;line-height:1}.modal-body{padding:20px 18px 6px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}.field{margin-bottom:16px}.field label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}.field label i{color:var(--danger);font-style:normal;margin-right:2px}.field input,.field select{width:100%;height:36px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:var(--ink);outline:none;background:#fff}.field .err{display:none;color:var(--danger);font-size:12px;margin-top:4px}.field.invalid input,.field.invalid select{border-color:var(--danger)}.field.invalid .err{display:block}.field .tip{font-size:12px;color:var(--weak);margin-top:5px}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:9px 18px;border-radius:4px;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}.toast.ok{background:var(--ok)}.toast.info{background:#7a8699}.focus-target{outline:2px solid #e3a344;outline-offset:2px}
@media(max-width:1100px){.top-tabs{margin-left:20px;gap:6px}.top-tab{padding:0 10px}.top-right{gap:9px}.table-card{max-width:calc(100vw - 264px)}}
</style>
<style>
/* 列表筛选：参考后台「筛选」按钮浮层交互 */
.list-filter-card{position:relative;padding:0!important;overflow:visible;min-height:62px}
.list-toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.list-toolbar-primary,.list-toolbar-actions{display:flex;align-items:center;gap:10px}.list-toolbar-actions{margin-left:auto}
.filter-trigger svg{width:15px;height:15px;flex:0 0 auto}
.filter-popover{position:absolute;z-index:45;right:20px;top:58px;width:min(920px,calc(100vw - 300px));min-width:420px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:24px 26px 20px;box-shadow:0 8px 24px rgba(31,35,41,.16)}
.filter-popover.compact{width:440px}.filter-popover.medium{width:min(720px,calc(100vw - 300px))}.filter-popover[hidden]{display:none}
.filter-popover:before{content:"";position:absolute;right:34px;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid #e4e7ed;border-top:1px solid #e4e7ed;transform:rotate(45deg)}
.filter-popover .filter-bar,.filter-popover .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;align-items:center}
.filter-popover .filter-bar .fitem,.filter-popover .form-grid label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;margin:0}
.filter-popover .filter-bar .fitem input,.filter-popover .filter-bar .fitem select,.filter-popover .form-grid input,.filter-popover .form-grid select{width:100%;max-width:none}
.filter-popover .filter-footer,.filter-popover .form-actions{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:18px;border-top:1px solid #f0f1f3}
.filter-popover .filter-footer .btn,.filter-popover .form-actions .btn{min-width:72px}
@media(max-width:900px){.filter-popover,.filter-popover.medium{right:10px;width:calc(100vw - 270px);min-width:360px}.filter-popover .filter-bar,.filter-popover .form-grid{grid-template-columns:1fr}}
</style>
<style>
.filter-popover.compact .filter-bar{grid-template-columns:1fr}
.filter-popover .form-grid label.duration-filter{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filter-popover .form-grid label.duration-filter>select{width:92px}.filter-popover .form-grid label.duration-filter>input{width:150px}.filter-popover .form-grid label.duration-filter .totalMaxWrap{display:inline-flex;align-items:center;gap:8px}.filter-popover .form-grid label.duration-filter .totalMaxWrap[hidden]{display:none}
</style>
</head>

    <div class="modal-head"><span id="modal-title">新增智能体</span><button type="button" class="modal-close" id="modal-close" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div class="field" id="field-type"><label for="input-type"><i>*</i>智能体类型</label><select id="input-type"><option value="">请选择智能体类型</option><option value="飞书aily-工作流应用">飞书aily-工作流应用</option></select><div class="err">请选择智能体类型</div></div>
      <div class="field" id="field-key"><label for="input-key"><i>*</i>应用Key</label><input id="input-key" maxlength="100" autocomplete="off" placeholder="请输入应用Key"><div class="err">请输入应用Key</div></div>
      <div class="field" id="field-secret"><label for="input-secret"><i>*</i>应用密钥</label><input id="input-secret" type="password" maxlength="200" autocomplete="new-password" placeholder="请输入应用密钥"><div class="err">请输入应用密钥</div><div class="tip">应用密钥仅在弹窗中维护，列表统一脱敏显示。</div></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn" id="modal-cancel">取消</button><button type="button" class="btn primary" id="modal-save">保存</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var PAGES={
  '智能体管理':'智能体管理_v1.0.html',
  '工作流管理':'工作流管理_v1.0.html',
  '艾客坐席管理':'艾客坐席管理_v1.0.html','供应商管理':'供应商管理_v1.0.html',
  'AI托管账号':'AI托管账号_v1.0.html',
  '客户会话管理':'客户会话管理_v1.0.html',
  '会话消息管理':'会话消息管理_v1.0.html',
  'AI响应明细':'AI响应明细_v1.0.html'
};
function pageUrl(file){
  var target=new URL(file,location.href);target.search='';
  var current=new URLSearchParams(location.search);
  ['embed','sandbox'].forEach(function(k){if(current.has(k))target.searchParams.set(k,current.get(k));});
  return target.href;
}
function showToast(message,type){var el=document.getElementById('toast');el.textContent=message;el.className='toast '+(type||'ok');el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.style.display='none';},2200);}
document.querySelectorAll('.js-nav').forEach(function(el){
  el.tabIndex=0;el.setAttribute('role','link');
  function go(){var file=PAGES[el.dataset.page];if(file)location.href=pageUrl(file);}
  el.addEventListener('click',go);el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go();}});
});
document.querySelectorAll('.nav-group').forEach(function(el){
  var children=document.getElementById(el.dataset.target);
  function toggle(){var open=!el.classList.contains('open');el.classList.toggle('open',open);children.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));}
  el.addEventListener('click',toggle);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
});
document.querySelectorAll('.js-nothing').forEach(function(el){el.addEventListener('click',function(){showToast('该入口不在本次原型演示范围内','info');});});

var rows=[
  {id:3,type:'飞书aily-工作流应用',key:'agent_customer_service_prod',secret:'sk_prod_8Qw2Lm9X7Kp4',creator:'陈嘉豪',createdAt:'2026-09-09 09:30',updater:'陈嘉豪',updatedAt:'2026-09-09 09:30'}
];
var nextId=4,editingId=null,lastFocus=null;
var tbody=document.getElementById('tbody'),modal=document.getElementById('edit-modal'),title=document.getElementById('modal-title');
var typeInput=document.getElementById('input-type'),keyInput=document.getElementById('input-key'),secretInput=document.getElementById('input-secret');
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function maskSecret(secret){var text=String(secret||'');var tail=text.slice(-4);return '••••••••'+tail;}
function now(){var d=new Date();function p(v){return String(v).padStart(2,'0');}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function visibleRows(){var q=document.getElementById('q-key').value.trim().toLowerCase();return rows.filter(function(r){return !q||r.key.toLowerCase().indexOf(q)!==-1;}).slice().sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))||b.id-a.id;});}
function render(){
  var list=visibleRows();
  if(!list.length)tbody.innerHTML='<tr class="empty-row"><td colspan="9">暂无数据</td></tr>';
  else tbody.innerHTML=list.map(function(r){return '<tr><td class="weak">'+r.id+'</td><td>'+esc(r.type)+'</td><td class="key-cell">'+esc(r.key)+'</td><td class="secret-cell" title="应用密钥已脱敏">'+esc(maskSecret(r.secret))+'</td><td>'+esc(r.creator)+'</td><td class="weak">'+esc(r.createdAt)+'</td><td>'+esc(r.updater)+'</td><td class="weak">'+esc(r.updatedAt)+'</td><td><button class="action-link btn-edit" data-id="'+r.id+'">编辑</button></td></tr>';}).join('');
  document.getElementById('pager-info').textContent='共 '+list.length+' 条';
  tbody.querySelectorAll('.btn-edit').forEach(function(btn){btn.addEventListener('click',function(){openModal(Number(btn.dataset.id));});});
}
function clearValidation(){document.getElementById('field-type').classList.remove('invalid');document.getElementById('field-key').classList.remove('invalid');document.getElementById('field-secret').classList.remove('invalid');}
function openModal(id){
  editingId=id==null?null:id;clearValidation();lastFocus=document.activeElement;
  if(editingId==null){title.textContent='新增智能体';typeInput.value='';typeInput.disabled=false;keyInput.value='';secretInput.value='';}
  else{var row=rows.find(function(item){return item.id===editingId;});if(!row)return;title.textContent='编辑智能体';typeInput.value=row.type;typeInput.disabled=true;keyInput.value=row.key;secretInput.value=row.secret;}
  modal.classList.add('active');setTimeout(function(){(editingId==null?typeInput:keyInput).focus();},0);
}
function closeModal(){modal.classList.remove('active');clearValidation();if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function save(){
  var type=typeInput.value,key=keyInput.value.trim(),secret=secretInput.value.trim(),valid=true;
  document.getElementById('field-type').classList.toggle('invalid',!type);document.getElementById('field-key').classList.toggle('invalid',!key);document.getElementById('field-secret').classList.toggle('invalid',!secret);
  if(!type){typeInput.focus();valid=false;}else if(!key){keyInput.focus();valid=false;}else if(!secret){secretInput.focus();valid=false;}
  if(!valid)return;
  var stamp=now();
  if(editingId==null){rows.push({id:nextId++,type:type,key:key,secret:secret,creator:'陈嘉豪',createdAt:stamp,updater:'陈嘉豪',updatedAt:stamp});showToast('新增成功','ok');}
  else{var row=rows.find(function(item){return item.id===editingId;});row.key=key;row.secret=secret;row.updater='陈嘉豪';row.updatedAt=stamp;showToast('保存成功','ok');}
  document.getElementById('q-key').value='';closeModal();render();
}
var filterTrigger=document.getElementById('btn-filter'),filterPopover=document.getElementById('filter-popover');
function setFilterOpen(open){filterPopover.hidden=!open;filterTrigger.setAttribute('aria-expanded',String(open));if(open)setTimeout(function(){document.getElementById('q-key').focus();},0);}
filterTrigger.addEventListener('click',function(e){e.stopPropagation();setFilterOpen(filterPopover.hidden);});
document.getElementById('btn-filter-close').addEventListener('click',function(){setFilterOpen(false);});
document.getElementById('btn-query').addEventListener('click',function(){render();setFilterOpen(false);});
document.getElementById('q-key').addEventListener('keydown',function(e){if(e.key==='Enter'){render();setFilterOpen(false);}});
document.getElementById('btn-reset').addEventListener('click',function(){document.getElementById('q-key').value='';render();});
filterPopover.addEventListener('click',function(e){e.stopPropagation();});
document.addEventListener('click',function(){setFilterOpen(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape')setFilterOpen(false);});
document.getElementById('btn-add').addEventListener('click',function(){openModal(null);});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal-cancel').addEventListener('click',closeModal);
document.getElementById('modal-save').addEventListener('click',save);
[typeInput,keyInput,secretInput].forEach(function(input){input.addEventListener('input',function(){if(input.value.trim())input.closest('.field').classList.remove('invalid');});});
document.addEventListener('keydown',function(e){
  if(!modal.classList.contains('active'))return;
  if(e.key==='Escape'){closeModal();return;}
  if(e.key==='Enter'&&document.activeElement!==document.getElementById('modal-close')){e.preventDefault();save();}
  if(e.key==='Tab'){var controls=[document.getElementById('modal-close'),typeInput,keyInput,secretInput,document.getElementById('modal-cancel'),document.getElementById('modal-save')];var first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
var focusId=new URLSearchParams(location.search).get('focus');if(focusId&&document.getElementById(focusId))document.getElementById(focusId).classList.add('focus-target');
render();
})();
</script>
</body>
</html>
