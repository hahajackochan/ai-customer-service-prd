<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 会话消息管理 v1.0</title>
<style>
:root{--brand:#a86115;--amber:#f9ecc9;--amber-deep:#8a5a1e;--ink:#303133;--text:#4a4f55;--muted:#606266;--weak:#909399;--line:#ebeef4;--head:#f2f5f9;--page:#f0f1f2;--danger:#f56c6c;--ok:#67c23a;--blue:#6f8db5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.topbar{height:64px;background:#fff;display:flex;align-items:center;padding:0 24px;position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:34px;width:auto;display:block}
.logo b{font-size:18px;font-weight:700;color:#3a3f45;letter-spacing:1px}
.top-tabs{display:flex;align-items:center;gap:14px;margin-left:56px}
.top-tab{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:4px;color:var(--text);font-size:14px;cursor:pointer;user-select:none}
.top-tab svg{width:16px;height:16px}
.top-tab.active{background:var(--amber);color:#5c4a1e;font-weight:600}
.tenant-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;background:var(--amber);color:#5c4a1e;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.tenant-pill .caret{font-size:10px;transform:scaleY(.9)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--ink)}
.avatar{width:30px;height:30px;border-radius:50%;background:#e8eaed;display:inline-flex;align-items:center;justify-content:center;color:#aeb4bc}
.top-right .quit{color:var(--blue);cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:224px;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex:0 0 auto;overflow-y:auto}
.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 20px;color:#3f444a;font-size:14px;cursor:pointer;user-select:none;background:transparent}
.nav-item svg{width:17px;height:17px;flex:0 0 auto;color:#5b6167}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .chev{color:#b9bec4;font-size:11px;transition:transform .15s}
.nav-item.open .chev{transform:rotate(180deg)}
.nav-item:hover{background:#f7f8f9}
.nav-item.active{background:var(--amber);color:#6b4410;font-weight:600}
.nav-item.active svg{color:#a86115}
.nav-item.child{padding-left:42px}
.nav-item.child .dot-ic{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;color:#9aa0a6;flex:0 0 auto}
.nav-item.child.active{background:var(--amber);color:#6b4410;font-weight:600}
.nav-item.child.active .dot-ic{color:#a86115}
.crumb-bar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.crumb-bar .collapse-ic{display:inline-flex;color:#3f444a;cursor:pointer}
.crumb-bar .crumb{color:#3f444a;font-size:14px}
.crumb-bar .crumb b{color:#6b4410;font-weight:600}
.tab-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px}
.tab-nav{color:#b9bec4;font-size:16px;cursor:pointer;user-select:none}
.tab{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;background:var(--amber);color:#6b4410;font-size:13px;font-weight:600}
.tab .dot{width:7px;height:7px;border-radius:50%;background:#a86115;display:inline-block}
.tab .x{cursor:pointer;opacity:.7;font-size:13px}
.page-body{padding:18px 20px;flex:1;min-width:0}
.card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(31,41,55,.04);margin-bottom:14px}
.filter-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.filter-bar .fitem{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.filter-bar .fitem input,.filter-bar .fitem select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:13px;color:var(--ink);outline:none}
.filter-bar .fitem input{width:180px}
.filter-bar .fitem select{min-width:110px;background:#fff}
.filter-bar .fitem input:focus,.filter-bar .fitem select:focus{border-color:var(--brand)}
.filter-bar .factions{display:inline-flex;gap:10px;margin-left:4px}
.toolbar{display:flex;align-items:center;margin-top:2px}
.toolbar-actions{margin-left:auto;display:flex;gap:12px}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:30px;cursor:pointer;font-size:13px}
.btn:hover{color:var(--brand);border-color:#e3c692}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#8f5212;color:#fff}
.table-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(31,41,55,.04);overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:auto}
td,th{min-width:110px}
th{height:46px;background:var(--head);color:#5b6167;font-weight:600;border-bottom:1px solid var(--line);text-align:left;padding:0 14px;font-size:14px;white-space:nowrap}
td{height:52px;border-bottom:1px solid var(--line);padding:0 14px;color:var(--muted);vertical-align:middle;font-size:14px;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fdf9f0}
td.weak{color:var(--weak)}
td.strong{color:var(--ink)}
.empty-row td{color:var(--weak);text-align:center;height:84px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid}
.tag.yes{background:#f0f9eb;color:#529b2e;border-color:#e1f3d8}
.tag.no{background:#f4f4f5;color:#909399;border-color:#e9e9eb}
.tag.online{background:#fdf1e8;color:#a86115;border-color:#f3d5bc}
.tag.offline{background:#f4f4f5;color:#909399;border-color:#e9e9eb}
.tag.mode{background:#ecf5ff;color:#337ecc;border-color:#d9ecff;margin-left:4px}
.pager{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted)}
.page-size{height:30px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;display:inline-flex;align-items:center;padding:0 12px;color:var(--muted);font-size:13px}
.page-num{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);border:1px solid transparent;cursor:pointer;background:#fff}
.page-num.active{background:var(--brand);color:#fff}
.note{margin-top:12px;font-size:12px;color:var(--weak)}
.modal{position:fixed;inset:0;background:rgba(31,35,41,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.modal-box{width:440px;background:#fff;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.18);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line);color:var(--ink)}
.modal-close{border:0;background:transparent;font-size:18px;color:var(--weak);cursor:pointer;line-height:1}
.modal-body{padding:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
.field label i{color:var(--danger);font-style:normal;margin-right:2px}
.field input{width:100%;height:34px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font-size:13px;outline:none;color:var(--ink)}
.field input:focus{border-color:var(--brand)}
.field .err{display:none;color:var(--danger);font-size:12px;margin-top:4px}
.field.invalid input{border-color:var(--danger)}
.field.invalid .err{display:block}
.field .tip2{color:var(--weak);font-size:12px;margin-top:4px}
.acct-line{font-size:12px;color:var(--weak);margin-bottom:12px}
.opt{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;cursor:pointer}
.opt input{margin-top:3px}
.opt .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.opt .d{font-size:12px;color:var(--weak)}
.opt-err{display:none;color:var(--danger);font-size:12px;margin:2px 0 6px}
.opt-err.show{display:block}
.warn-text{font-size:13.5px;line-height:1.9;color:var(--ink)}
.switch{position:relative;display:inline-block;width:38px;height:20px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#c0c4cc;border-radius:20px;transition:.2s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--brand)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:200;display:none;padding:9px 18px;border-radius:4px;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.toast.ok{background:var(--ok)}
.toast.fail{background:var(--danger)}
.toast.info{background:#7a8699}
.hosted-line{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.hosted-line .hosted-label{font-weight:600;font-size:13.5px;color:var(--ink)}
.opt.disabled{opacity:.45;pointer-events:none}
.modal-box.hosted-off .opt{opacity:.45;pointer-events:none}

/* AI conversation additions; existing console chrome remains unchanged. */

.sidebar{height:calc(100vh - 64px);position:sticky;top:0}
.nav-item.ai-child{padding-left:38px;font-size:13px}
.page-body{min-height:0}
.form-grid{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.form-grid label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.form-grid input,.form-grid select,.date-tools input,.pager select{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:var(--ink);font:inherit;background:white;min-width:0}
.form-grid input{width:158px}
.form-grid input[type=date]{width:145px}
.form-grid input[type=number]{width:106px}
.form-grid select{min-width:104px}
.form-grid input:focus{outline:1px solid var(--brand)}
.form-actions{display:flex;gap:10px}
.query-error{color:#c64d44;font-size:13px;margin-top:8px}
.query-error:empty{display:none}
.view-title{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.sample{font-size:12px;font-weight:400;color:var(--weak)}
.table-scroll{overflow:auto;max-height:calc(100vh - 410px);min-height:180px}
.wide-table th{position:sticky;top:0;z-index:2}
.wide-table td{height:56px}
.wide-table th,.wide-table td{min-width:92px;padding:10px 14px}
.wide-table .cell-text{max-width:260px;min-width:230px;white-space:normal;line-height:1.65} .reply-list{display:grid;gap:6px} .reply-item{display:flex;gap:6px;align-items:flex-start} .reply-item em{flex:0 0 auto;min-width:16px;height:16px;margin-top:3px;padding:0 4px;border-radius:8px;background:#f4f5f7;color:var(--brand);font-style:normal;font-size:11px;line-height:16px;text-align:center} .reply-item span{flex:1 1 auto}
.cell-long{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wide-table .action-col{position:sticky;right:0;min-width:112px;background:#fff;box-shadow:-3px 0 5px rgba(0,0,0,.035)}
.wide-table th.action-col{z-index:3;background:var(--head)}
.link-btn{border:0;background:none;color:var(--brand);cursor:pointer;padding:3px 0;font:inherit;text-decoration:none}
.link-btn:hover{text-decoration:underline}
.op-btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 18px;border:0;border-radius:6px;background:#f4f5f7;color:var(--brand);font:inherit;font-size:13px;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap}.op-btn:hover{background:#eceef2}.op-btn.danger{color:#c0392b}.row-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wide-table .time-col{min-width:175px;font-size:13px;font-variant-numeric:tabular-nums}
.muted{color:var(--weak)}
.switch:has(input:disabled){opacity:.5}
.switch input:disabled+.slider{cursor:not-allowed}
.switch input:focus-visible+.slider{outline:2px solid #c9974a;outline-offset:2px}
.switch-label{display:inline-flex;align-items:center;gap:7px}
.small-status{display:block;font-size:11px;color:var(--weak);margin-top:4px;max-width:158px;white-space:normal}
.tag.error{background:#fff1f0;border-color:#ffccc7;color:#c0392b}
.tag.transfer{background:#fff7e6;border-color:#ffe1a6;color:#a76705}
.tag.waiting{background:#f4f4f5;border-color:#e9e9eb;color:#909399}
.pager{border-top:1px solid var(--line)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .pager-pages{display:flex;gap:5px}
.drawer-mask{position:fixed;inset:0;z-index:90;display:none;background:rgba(31,35,41,.28)}
.drawer-mask.open{display:flex;justify-content:flex-end}
.drawer{height:100vh;width:min(680px,92vw);background:white;box-shadow:-10px 0 32px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.drawer-body{padding:20px 22px;overflow:auto;flex:1}
.drawer-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
.trace-summary{padding:14px 16px;border:1px solid #f0e2cc;border-radius:10px;background:linear-gradient(180deg,#fffaf2,#fffdfa)}


.trace-summary-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;color:var(--muted)}
.trace-summary-meta span{display:inline-flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.trace-summary-meta em{font-style:normal;color:var(--weak)}
.trace-step{border-top:1px solid var(--line);padding:16px 0 2px;margin-top:16px}
.trace-step:first-of-type{border-top:0;margin-top:14px;padding-top:0}
.trace-step h4{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:#634314;font-size:14px;font-weight:700}
.trace-step h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--amber-deep);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

.trace-step pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fa;border:1px solid var(--line);padding:12px;border-radius:6px;font-size:12px;line-height:1.8;color:var(--muted)}
.trace-step summary{cursor:pointer;font-size:13px;color:var(--brand);padding:6px 0;font-weight:600}
.trace-results{margin-top:2px}
.trace-results-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.trace-results-meta b{color:var(--ink);font-weight:600}
.trace-result{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.trace-result:hover{border-color:#e8d3b0;box-shadow:0 2px 8px rgba(168,97,21,.07)}
.trace-result[open]{border-color:#e8d3b0;box-shadow:0 2px 10px rgba(168,97,21,.08)}
.trace-step .trace-result>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--ink);list-style:none;min-width:0}
.trace-result>summary::-webkit-details-marker{display:none}
.trace-result>summary:before{content:'';flex:0 0 auto;width:7px;height:7px;margin:0 2px 0 1px;border-right:2px solid var(--weak);border-bottom:2px solid var(--weak);transform:rotate(-45deg);transition:transform .16s,border-color .16s}
.trace-result[open]>summary:before{transform:rotate(45deg);border-color:var(--brand)}
.trace-result>summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.trace-result-copy{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.6}
.trace-result-name{display:block;font-weight:600;font-size:13px}
.trace-result-state{display:inline-flex;align-items:center;height:20px;padding:0 8px;margin-top:5px;border-radius:10px;background:#f4f6f9;font-size:11px;color:var(--muted);font-weight:400}
.trace-result-score{flex:0 0 auto;text-align:right;max-width:38%;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;padding-left:12px;border-left:1px dashed var(--line)}
.trace-result-score small{display:block;color:var(--weak);font-size:11px;margin-bottom:2px}
.trace-result-score b{font-size:16px;color:var(--brand);line-height:1.2}
.trace-result-score.missing b{font-size:12px;color:var(--weak);font-weight:400}
.trace-result-body{border-top:1px solid var(--line);padding:6px 14px 10px;background:#fafbfc}
.trace-result-empty{border:1px dashed #e3e6ec;background:#fafbfc;padding:18px 14px;border-radius:8px;color:var(--weak);font-size:12px;line-height:1.8;text-align:center}
.chat-layout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.chat-card,.trace-card{min-width:0}
.empty-panel{color:var(--weak);text-align:center;padding:64px 14px;font-size:13px;line-height:1.9}
.duration-hero{padding:16px 18px;background:linear-gradient(180deg,#fffaf2,#fffdfa);border:1px solid #f0e2cc;border-radius:10px;margin:14px 0 18px}
.duration-hero .duration-label{display:block;font-size:12px;color:var(--weak)}
.duration-hero .duration-value{display:flex;align-items:baseline;gap:6px;margin:6px 0 4px}
.duration-hero .duration-value b{color:var(--brand);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.duration-hero .duration-value span{font-size:13px;color:var(--brand);font-weight:700}
.duration-hero p{margin:2px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.duration-hero 


.timeline{padding-top:2px}
.timeline-item{border-left:2px solid #f0e2cc;margin-left:9px;padding:0 0 18px 22px;position:relative}
.timeline-item:last-child{border-left-color:transparent;padding-bottom:0}
.timeline-item:before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brand);left:-5.5px;top:6px;box-shadow:0 0 0 3px #fdf4e8}
.timeline-item.origin:before{background:#c58b3c}
.timeline-item.reference:before{background:#ccd2da;box-shadow:0 0 0 3px #f4f6f9}
.timeline-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timeline-item .row b{font-size:13px;font-weight:600;color:var(--ink)}
.timeline-item .tl-dur{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--brand);background:#fdf4e8;border-radius:10px;padding:1px 9px;font-variant-numeric:tabular-nums}
.timeline-item.reference .tl-dur,.timeline-item.origin .tl-dur{background:#f4f6f9;color:var(--weak);font-weight:400}
.timeline-item small{display:block;font-size:12px;color:var(--weak);font-variant-numeric:tabular-nums}
.time-track{height:5px;background:#f2f2f2;border-radius:3px;margin-top:8px;overflow:hidden}
.time-track i{display:block;height:5px;background:linear-gradient(90deg,#d3a25a,#e8c391);border-radius:3px}
.history-top{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--weak);font-size:12px;background:#fafbfc}
.spinner{width:14px;height:14px;border:2px solid #e7e9ed;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}
.chat-layout{display:grid;grid-template-columns:minmax(360px,1.45fr) minmax(360px,1fr);gap:14px;height:calc(100vh - 330px);min-height:380px}
.chat-card,.trace-card{background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chat-heading{height:46px;flex-shrink:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:600}
.chat-stream{overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;flex:1;min-height:0;padding:12px 20px 22px;background:#fafbfc}
.trace-content{overflow:auto;flex:1;padding:16px;min-height:0}
.conversation-meta{display:flex;gap:10px 20px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:14px}
.conversation-meta b{font-size:14px}
.conversation-meta .return{margin-left:auto}
.date-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px}
.seg{display:inline-flex;border:1px solid #dcdfe6;border-radius:4px;overflow:hidden}
.seg button{height:30px;padding:0 14px;border:0;background:white;color:var(--muted);border-right:1px solid #dcdfe6;cursor:pointer}
.seg button:last-child{border:0}
.seg button.on{background:var(--amber);color:#6b4410;font-weight:600}
.custom-dates{display:none;align-items:center;gap:8px}
.custom-dates.show{display:inline-flex}
.message-row{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 17px}
.message-row.member{align-items:flex-end}
.message-row.event{align-items:center}
.message-row small{font-size:11px;color:var(--weak);margin-bottom:4px}
.bubble{max-width:82%;padding:10px 13px;border-radius:8px;background:white;border:1px solid var(--line);line-height:1.8;font-size:13px;overflow-wrap:anywhere}
.member .bubble{background:#f5f6f7}
.message-row.ai .bubble{background:#fff9ee;border-color:#ecca96}
.message-row.selected .bubble{outline:2px solid #cf9b50}
.message-row.event .bubble{background:#fff7e6;color:#865508;font-size:12px;border-color:#f0d6a9;max-width:95%}
.ai-badge{display:inline-flex;border:0;align-items:center;margin-top:6px;gap:5px;background:#d17b11;color:#fff;font-weight:700;font-size:12px;border-radius:12px;cursor:pointer;padding:4px 10px;box-shadow:0 2px 5px #dfb06b50}
.ai-badge.transfer{background:#a46b19}
.ai-badge.error{background:#c65747}
.date-divider{text-align:center;margin:8px 0 18px;color:var(--weak);font-size:11px}
.date-divider span{background:#eaecef;border-radius:10px;padding:3px 10px}
.picture-preview{padding:0;border:0;background:transparent;color:var(--brand);cursor:pointer;text-align:left}
.picture-preview svg{display:block;width:155px;height:90px;border-radius:4px}
.preview-box{width:90vw;height:90vh;background:#fff;border-radius:8px;display:flex;flex-direction:column}
.preview-stage{flex:1;overflow:hidden;background:#f4f5f7;touch-action:none;cursor:grab;display:grid;place-items:center}
.preview-stage svg{width:650px;height:400px;max-width:85vw;transform-origin:center}
.preview-box .modal-head{flex-shrink:0}
.modal-body .status-warning{color:#9a641a;background:#fff8ea;padding:10px;border-radius:5px}
.focus-target{outline:2px solid #e3a344;outline-offset:2px}
@media(max-width:1100px){.chat-layout{grid-template-columns:minmax(310px,1fr) minmax(310px,1fr)}
.top-tabs{margin-left:22px;gap:6px}
.top-right{gap:10px}
.table-scroll{max-height:510px}
}

<style>
/* 列表筛选：参考后台「筛选」按钮浮层交互 */
.list-filter-card{position:relative;padding:0!important;overflow:visible;min-height:62px}
.list-toolbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.list-toolbar-primary,.list-toolbar-actions{display:flex;align-items:center;gap:10px}.list-toolbar-actions{margin-left:auto}
.filter-trigger svg{width:15px;height:15px;flex:0 0 auto}
.export-trigger svg{width:15px;height:15px;flex:0 0 auto}
.filter-popover{position:absolute;z-index:45;right:20px;top:58px;width:min(920px,calc(100vw - 300px));min-width:420px;background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:24px 26px 20px;box-shadow:0 8px 24px rgba(31,35,41,.16)}
.filter-popover.compact{width:440px}.filter-popover.medium{width:min(720px,calc(100vw - 300px))}.filter-popover[hidden]{display:none}
.filter-popover:before{content:"";position:absolute;right:34px;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid #e4e7ed;border-top:1px solid #e4e7ed;transform:rotate(45deg)}
.filter-popover .filter-bar,.filter-popover .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;align-items:center}

.filter-popover .filter-bar .fitem input,.filter-popover .filter-bar .fitem select,.filter-popover .form-grid input,.filter-popover .form-grid select{width:100%;max-width:none}
.filter-popover .filter-footer,.filter-popover .form-actions{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:18px;border-top:1px solid #f0f1f3}
.filter-popover .filter-footer .btn,.filter-popover .form-actions .btn{min-width:72px}
@media(max-width:900px){.filter-popover,.filter-popover.medium{right:10px;width:calc(100vw - 270px);min-width:360px}.filter-popover .filter-bar,.filter-popover .form-grid{grid-template-columns:1fr}}
</style>
<style>
.filter-popover.compact .filter-bar{grid-template-columns:1fr}

.filter-popover .form-grid label.duration-filter>select{width:92px}.filter-popover .form-grid label.duration-filter>input{width:150px}.filter-popover .form-grid label.duration-filter .filter-popover .form-grid label.duration-filter

<style>

.trace-sub{margin:2px 0 10px;color:var(--weak);font-size:13px}

const sessions=NAMES.map((name,i)=>({id:'S_'+pad(i+1,4),type:'single',cid:'C_'+(88001+i),cname:name,mid:'wx_100'+MIDS[i],mname:'会员助理 小菲'+MIDS[i],supplier:'艾客',corp:MIDS[i]%2?'索菲亚家居':'索菲亚精选',configured:i%3!==1,records:[]}));

 const s=sessions[sidx], count=sidx===0?44:4+(sidx%3);
 for(let j=0;j<count;j++){

 if(sidx===0)kind=j===43?'pending':j%4===1?'human':'ai';

 }

 return '<tr data-id="'+r.replyId+'">'+metadata+td('<b>'+sec(r.total)+'</b> 秒')+td(E(D.fmt(r.receivedAt)),'time-col muted')+td('<button type="button" class="op-btn" data-latency="'+r.id+'">耗时详情</button>','action-col')+'</tr>';
}
function render(){const all=matching();page=Math.max(1,Math.min(page,Math.ceil(all.length/size)||1));document.getElementById('tbody').innerHTML=all.length?all.slice((page-1)*size,page*size).map(row).join(''):'<tr><td colspan="'+headers.length+'" style="text-align:center;height:180px;color:var(--weak)">暂无符合条件的记录</td></tr>';document.getElementById('pager').innerHTML='<span>共 '+all.length+' 条</span><select id="page-size" aria-label="每页条数">'+[10,20,50].map(n=>'<option '+(n===size?'selected':'')+'>'+n+'条/页</option>').join('')+'</select><button class="page-num" id="prev" '+(page===1?'disabled':'')+'>‹</button><span>第 '+page+' / '+(Math.ceil(all.length/size)||1)+' 页</span><button class="page-num" id="next" '+(page*size>=all.length?'disabled':'')+'>›</button>';document.getElementById('prev').onclick=()=>{page--;render();};document.getElementById('next').onclick=()=>{page++;render();};document.getElementById('page-size').onchange=e=>{size=parseInt(e.target.value,10);page=1;render();};}
function apply(){const q=stateForm(),err=validate(q);error(err);if(err)return false;applied=q;page=1;render();return true;}
const filterTrigger=document.getElementById('btn-filter'),filterPopover=document.getElementById('filter-popover');
function setFilterOpen(open){filterPopover.hidden=!open;filterTrigger.setAttribute('aria-expanded',String(open));}
filterTrigger.addEventListener('click',e=>{e.stopPropagation();setFilterOpen(filterPopover.hidden);});filterPopover.addEventListener('click',e=>e.stopPropagation());document.getElementById('filter-close').onclick=()=>setFilterOpen(false);document.addEventListener('click',()=>setFilterOpen(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setFilterOpen(false);});
form.addEventListener('submit',e=>{e.preventDefault();if(apply())setFilterOpen(false);});document.getElementById('reset').onclick=()=>{HTMLFormElement.prototype.reset.call(form);apply();paintRanges();};
function paintRanges(){document.querySelectorAll('[data-range]').forEach(box=>{const a=box.querySelector('input[name=start]'),b=box.querySelector('input[name=end]'),t=box.querySelector('.dr-text');t.value=(a.value||b.value)?(a.value||'开始日期')+' ～ '+(b.value||'结束日期'):'';});}document.querySelectorAll('[data-range]').forEach(box=>{const a=box.querySelector('input[name=start]'),b=box.querySelector('input[name=end]');const open=el=>{try{el.showPicker();}catch(_){el.focus();}};box.addEventListener('click',()=>open(!a.value||b.value?a:b));a.addEventListener('change',()=>{paintRanges();if(a.value&&!b.value)setTimeout(()=>open(b),0);});b.addEventListener('change',paintRanges);});paintRanges();


let pending=null;
document.getElementById('tbody').addEventListener('change',e=>{if(!e.target.dataset.switch)return;const s=D.sessions.find(s=>s.id===e.target.dataset.switch),target=e.target.checked;e.target.checked=D.enabled(s);if(!D.eligible(s))return;pending={s,target};const modal=document.getElementById('session-modal');modal.querySelector('#session-title').textContent=target?'开启会话AI接管':'关闭会话AI接管';modal.querySelector('#session-copy').textContent=s.cname+' × '+s.mname+'（'+s.id+'）';modal.querySelector('#session-effect').textContent=target?'账号已开启单聊AI接管，本次仅为该会话开启AI接管。':'仅关闭该会话的AI接管，不改变账号的单聊AI接管配置，也不清除历史AI回复及追溯。';modal.classList.add('active');modal.querySelector('#session-confirm').focus();});
const cancel=()=>{pending=null;document.getElementById('session-modal').classList.remove('active');};document.getElementById('session-cancel').onclick=cancel;document.getElementById('session-close').onclick=cancel;document.getElementById('session-confirm').onclick=()=>{if(!pending)return;const ok=D.setSession(pending.s.id,pending.target);cancel();render();showToast(ok?'保存成功':'账号未开启单聊AI接管，请先配置账号',ok?'ok':'fail');};
function trace(r){openDrawer('AI决策追溯',D.traceHTML(r),'<a class="link-btn" href="'+D.url('会话消息详情_v1.0.html',{...listContext(),sid:r.sid,message:r.id,trace:r.id})+'">在聊天记录中定位</a>'+(r.ai?'<a class="link-btn" href="'+D.url('AI响应明细_v1.0.html',{id:r.traceId})+'">查看AI响应明细</a>':''));}
function latency(r){const timeline=[{name:'系统接收到问题',at:r.receivedAt,origin:true},...r.stages];openDrawer('AI回复响应详情','<div class="trace-summary"><div class="trace-summary-meta"><span><em>AI决策追溯ID</em>'+E(r.traceId)+'</span><span><em>会话ID</em>'+E(r.sid)+'</span></div></div><div class="duration-hero"><span class="duration-label">AI响应总时长</span><div class="duration-value"><b>'+sec(r.total)+'</b><span>秒</span></div></div><div class="timeline">'+timeline.map(n=>'<div class="timeline-item'+(n.reference?' reference':'')+(n.origin?' origin':'')+'"><div class="row"><b>'+n.name+'</b>'+(n.reference||n.origin?'':'<span class="tl-dur">'+sec(n.duration)+' 秒</span>')+'</div><small>'+D.fmt(n.at)+'</small>'+(!n.reference&&!n.origin?'<div class="time-track"><i style="width:'+Math.max(3,n.duration/r.total*100)+'%"></i></div>':'')+'</div>').join('')+'</div>','<button class="link-btn" id="latency-trace">查看AI决策追溯</button>');document.getElementById('latency-trace').onclick=()=>trace(r);}
document.getElementById('tbody').addEventListener('click',e=>{const a=e.target.closest('[data-trace],[data-latency]');if(!a)return;const r=D.records.find(r=>r.id===(a.dataset.trace||a.dataset.latency));if(a.dataset.trace)trace(r);else latency(r);});
if(D.params.get('filters')){try{const q=JSON.parse(D.params.get('filters'));for(const[k,v]of Object.entries(q))if(form.elements[k])form.elements[k].value=v;}catch(_){} }
applied=stateForm();page=Math.max(1,Math.floor(+D.params.get('page')||1));size=[10,20,50].includes(+D.params.get('size'))?+D.params.get('size'):10;paintRanges();
if(D.params.get('state')==='forbidden'){root.innerHTML='<div class="card empty-panel">暂无此页面的查看权限（原型状态）</div>';return;}
if(D.params.get('state')==='error'){root.innerHTML='<div class="card empty-panel">数据加载失败 <button class="btn" id="retry">重试</button></div>';document.getElementById('retry').onclick=()=>{const u=new URL(location.href);u.searchParams.delete('state');location.href=u;};return;}
render();if(D.params.get('trace')){const r=D.records.find(r=>r.id===D.params.get('trace'));if(r?.trace)trace(r);}
})();
</script>
</body>
</html>
